<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO STORE</title>
    
    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Outlined" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Icons+Round" rel="stylesheet">
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { emailjs.init("yY04CGM5Tub3olhjG"); })();
    </script>
    
    <style>
        :root {
            --bg-color: #0f0f13; --card-bg: #1a1a20; --header-bg: #131318;
            --text-main: #ffffff; --text-secondary: #a0a0a0;
            --accent-red: #d93025; --accent-red-hover: #b71c1c;
            --accent-green: #4caf50; --accent-yellow: #fdd835;
            --input-bg: #25252e; --border-radius: 12px; --border-color: #25252e;
        }
        [data-theme="light"] {
            --bg-color: #f5f5f7; --card-bg: #ffffff; --header-bg: #ffffff;
            --text-main: #1d1d1f; --text-secondary: #6e6e73;
            --input-bg: #f0f0f5; --border-color: #e0e0e5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        
        /* Material Icons */
        .material-icons, .material-icons-outlined, .material-icons-round {
            font-size: 24px;
            vertical-align: middle;
            user-select: none;
        }
        .icon-sm { font-size: 18px; }
        .icon-lg { font-size: 32px; }
        .icon-xl { font-size: 48px; }
        
        header { background-color: var(--header-bg); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-img { height: 45px; width: auto; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { text-decoration: none; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: 0.2s; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: var(--accent-red); border-radius: 2px; }
        .profile-btn { background-color: var(--input-bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main); text-decoration: none; }
        
        main { flex: 1; padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        .search-bar-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .search-row { display: flex; gap: 10px; align-items: center; }
        .search-input, .category-select { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 20px; color: var(--text-main); font-size: 14px; outline: none; }
        .category-select option { background: var(--card-bg); color: var(--text-main); }
        .search-input { flex: 1; }
        .category-select { min-width: 140px; cursor: pointer; }
        
        .games-grid { display: grid; gap: 20px; grid-template-columns: repeat(1, 1fr); }
        @media (min-width: 768px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1201px) { .games-grid { grid-template-columns: repeat(5, 1fr); } }
        
        .game-card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; transition: 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid var(--border-color); }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .card-image { width: 100%; aspect-ratio: 16/9; background-color: var(--input-bg); overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-category { font-size: 11px; color: var(--accent-yellow); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 10px; }
        .iki-badge { background-color: rgba(217, 48, 37, 0.15); color: var(--accent-red); padding: 3px 8px; border-radius: 4px; font-weight: 700; display: flex; align-items: center; gap: 4px; }

        .detail-header { display: flex; gap: 25px; margin-bottom: 25px; flex-wrap: wrap; }
        .detail-image { width: 280px; height: 380px; background-color: var(--input-bg); border-radius: var(--border-radius); overflow: hidden; flex-shrink: 0; }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 12px; }
        .detail-title { font-size: 28px; font-weight: 800; }
        .detail-meta { display: flex; gap: 10px; flex-wrap: wrap; }
        .tag-pill { background-color: var(--input-bg); padding: 4px 12px; border-radius: 15px; font-size: 12px; border: 1px solid var(--border-color); display: flex; align-items: center; gap: 6px; }
        .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
        .download-btn { background-color: var(--accent-red); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; text-align: center; }
        .download-btn:hover { opacity: 0.9; }
        .library-btn { background-color: var(--input-bg); border: 1px solid var(--border-color); color: var(--text-main); }
        .library-btn:hover { border-color: var(--accent-green); color: var(--accent-green); }
        .library-btn.in-library { background-color: rgba(76, 175, 80, 0.15); border-color: var(--accent-green); color: var(--accent-green); }
        
        .detail-section { background-color: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .detail-section h3 { margin-bottom: 15px; font-size: 17px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .detail-section p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-wrap; }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-top: 12px; }
        .gallery-item { aspect-ratio: 16/9; background: var(--input-bg); border-radius: 8px; overflow: hidden; cursor: zoom-in; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* Additional Files */
        .additional-files { display: grid; gap: 10px; margin-top: 10px; }
        .file-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: var(--input-bg); border-radius: 8px; border: 1px solid var(--border-color); }
        .file-info { display: flex; align-items: center; gap: 10px; }
        .file-name { font-weight: 600; font-size: 13px; }
        .file-type { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; }
        .file-download { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 16px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; }
        .file-download:hover { border-color: var(--accent-red); color: var(--accent-red); }

        .library-item { display: flex; gap: 12px; align-items: center; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 10px; cursor: pointer; background: var(--input-bg); transition: 0.2s; }
        .library-item:hover { border-color: var(--accent-red); }
        .library-item img { width: 64px; height: 36px; object-fit: cover; border-radius: 4px; background: #333; }
        .lib-title { font-weight: 600; font-size: 13px; }
        .lib-cat { font-size: 11px; color: var(--accent-yellow); text-transform: uppercase; }

        .rating-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .rate-btn { flex: 1; min-width: 100px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); background: var(--input-bg); font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .rate-pos:hover { background: var(--accent-green); color: white; }
        .rate-neu:hover { background: var(--accent-yellow); color: #333; }
        .rate-neg:hover { background: var(--accent-red); color: white; }
        
        .review-list { margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .review-item { background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-red); }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .review-author { font-weight: 600; color: var(--text-main); }
        .review-score { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 4px; display: flex; align-items: center; gap: 4px; }
        .score-pos { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
        .score-neu { background: rgba(253, 216, 53, 0.2); color: var(--accent-yellow); }
        .score-neg { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }
        .review-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .review-live-indicator { display: inline-block; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

        .profile-header { display: flex; gap: 25px; margin-bottom: 25px; background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); align-items: center; flex-wrap: wrap; position: relative; border: 1px solid var(--border-color); }
        .back-nav-btn { background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
        .back-nav-btn:hover { color: var(--text-main); }
        .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .profile-info { flex: 1; min-width: 200px; }
        .profile-info h1 { font-size: 24px; margin-bottom: 5px; display: flex; align-items: center; gap: 10px; }
        .profile-status { color: var(--text-secondary); font-size: 12px; margin-bottom: 15px; display: flex; align-items: center; gap: 6px; }
        .profile-stats-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { text-align: center; background: var(--input-bg); padding: 8px 14px; border-radius: 8px; min-width: 65px; }
        .stat-val { font-size: 15px; font-weight: 700; color: var(--text-main); display: block; }
        .stat-lbl { font-size: 11px; color: var(--text-secondary); }
        .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: white; font-size: 12px; display: flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--accent-red); }
        .btn-secondary { background: var(--input-bg); color: var(--text-main); }
        .btn-danger { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }

        .share-modal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .share-btn { display: flex; flex-direction: column; align-items: center; padding: 15px; background: var(--input-bg); border-radius: 8px; cursor: pointer; border: 1px solid var(--border-color); transition: 0.2s; }
        .share-btn:hover { border-color: var(--accent-red); }
        .share-btn .material-icons { font-size: 28px; margin-bottom: 5px; }
        .share-btn span { font-size: 11px; color: var(--text-secondary); }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); width: 90%; max-width: 500px; position: relative; border: 1px solid var(--border-color); text-align: center; max-height: 80vh; overflow-y: auto; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 22px; cursor: pointer; }
        .close-modal:hover { color: var(--text-main); }
        .modal-title { font-size: 20px; color: var(--text-main); margin-bottom: 15px; }
        .login-title { font-size: 22px; color: var(--accent-red); margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); }
        .login-btn { width: 100%; padding: 12px; background: var(--accent-red); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .login-divider { margin: 15px 0; color: var(--text-secondary); font-size: 13px; }
        .login-link { color: var(--accent-red); text-decoration: none; font-weight: 600; cursor: pointer; }
        .file-drop { border: 2px dashed var(--border-color); padding: 30px; text-align: center; border-radius: 8px; color: var(--text-secondary); cursor: pointer; margin: 15px 0; }
        .file-drop:hover { border-color: var(--accent-red); }

        .console-stats { display: flex; justify-content: center; gap: 40px; margin: 25px 0; flex-wrap: wrap; }
        .stat-num { font-size: 28px; font-weight: 800; color: var(--accent-red); display: block; }
        .stat-label { font-size: 12px; color: var(--text-secondary); }
        
        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin: 25px 0; }
        .feature-card { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); border: 1px solid var(--border-color); }
        .feature-icon { font-size: 40px; margin-bottom: 10px; color: var(--accent-red); }
        .feature-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; color: var(--text-main); }
        .feature-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        .pro-banner { background: linear-gradient(45deg, #2c1a4d, #4a148c); padding: 25px; border-radius: var(--border-radius); margin: 25px 0; border: 1px solid #9c27b0; }
        .pro-title { font-size: 18px; font-weight: 800; color: #e1bee7; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
        .pro-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px; }
        .pro-list li { color: #fff; font-size: 13px; display: flex; align-items: center; gap: 8px; }
        .pro-list li .material-icons { font-size: 16px; color: #9c27b0; }

        .friends-list { margin-top: 10px; }
        .friend-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .friend-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .online-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; margin-left: auto; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .detail-header, .profile-header { flex-direction: column; }
            .detail-image { width: 100%; height: 220px; }
            .search-row { flex-direction: column; }
            .category-select { width: 100%; }
            .share-modal-grid { grid-template-columns: repeat(3, 1fr); }
            .btn-row { flex-direction: column; }
            .download-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-container" onclick="navigate('/')">
            <img src="logo.png" alt="Logo" class="logo-img" id="header-logo" onerror="this.src='logo-dark.png'">
        </a>
        <nav>
            <ul>
                <li><a href="/" onclick="navigate('/')"><span class="material-icons-outlined icon-sm">home</span>Главная</a></li>
                <li><a href="/games" onclick="navigate('/games')"><span class="material-icons-outlined icon-sm">games</span>Игры</a></li>
                <li><a href="/console" onclick="navigate('/console')"><span class="material-icons-outlined icon-sm">dashboard</span>Консоль</a></li>
                <li><a href="https://t.me/Zoro_service" target="_blank"><span class="material-icons-outlined icon-sm">forum</span>Сообщество</a></li>
            </ul>
        </nav>
        <a href="#" onclick="openAuthModal()" class="profile-btn" id="auth-btn">
            <span class="material-icons-outlined">account_circle</span>
            <span>Войти</span>
        </a>
    </header>

    <main id="app">
        <div id="loading" style="text-align:center; padding: 50px; color: var(--text-secondary)">
            <span class="material-icons" style="font-size: 48px; animation: pulse 1s infinite">sync</span>
            <p style="margin-top: 15px">Загрузка базы ZObase...</p>
            <div id="error-box" style="color:var(--accent-red); margin-top:15px; display:none"></div>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('auth-modal')"><span class="material-icons">close</span></button>
            <h2 class="login-title"><span class="material-icons" style="vertical-align: middle; margin-right: 8px">lock</span>Регистрация на ZGS</h2>
            
            <div id="register-step">
                <form onsubmit="event.preventDefault(); performRegister();">
                    <input type="email" id="reg-email" class="login-input" placeholder="E-mail" required>
                    <input type="password" id="reg-pass" class="login-input" placeholder="Пароль (мин. 6 символов)" required>
                    <input type="password" id="reg-pass-confirm" class="login-input" placeholder="Повторите пароль" required>
                    <button type="submit" class="login-btn"><span class="material-icons-outlined">person_add</span>Зарегистрироваться</button>
                </form>
                <div class="login-divider">или</div>
                <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px">Вспомнили, что у вас есть аккаунт?</p>
                <a class="login-link" onclick="switchAuthMode('login')"><span class="material-icons-outlined icon-sm">login</span>Войти</a>
            </div>

            <div id="login-step" style="display:none;">
                <form onsubmit="event.preventDefault(); performLogin();">
                    <input type="email" id="login-email" class="login-input" placeholder="E-mail" required>
                    <input type="password" id="login-pass" class="login-input" placeholder="Пароль" required>
                    <button type="submit" class="login-btn"><span class="material-icons-outlined">login</span>Войти</button>
                </form>
                <a class="login-link" onclick="resetPassword()" style="display:block; margin-top:10px; font-size:12px"><span class="material-icons-outlined icon-sm">lock_reset</span>Забыли пароль?</a>
                <div class="login-divider">или</div>
                <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px">Нет аккаунта?</p>
                <a class="login-link" onclick="switchAuthMode('register')"><span class="material-icons-outlined icon-sm">person_add</span>Зарегаться</a>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('review-modal')"><span class="material-icons">close</span></button>
            <h2 class="login-title" id="review-type-title"><span class="material-icons-outlined">rate_review</span>Отзыв</h2>
            <textarea id="review-text" class="login-input" style="height:100px; resize:none;" placeholder="Напишите ваш отзыв..."></textarea>
            <button class="login-btn" onclick="submitReview()"><span class="material-icons-outlined">send</span>Отправить</button>
        </div>
    </div>

    <!-- Share Modal -->
    <div id="share-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('share-modal')"><span class="material-icons">close</span></button>
            <h2 class="modal-title"><span class="material-icons-outlined" style="vertical-align: middle; margin-right: 8px">share</span>Поделиться</h2>
            <div class="share-modal-grid" id="share-buttons"></div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // === FIREBASE CONFIG ===
        const firebaseConfig = {
            apiKey: "AIzaSyA-EnR3TP-mxvDYa_2Fd40GnydWzh5ebKY",
            authDomain: "zoro-game-store-rew.firebaseapp.com",
            databaseURL: "https://zoro-game-store-rew-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zoro-game-store-rew",
            storageBucket: "zoro-game-store-rew.firebasestorage.app",
            messagingSenderId: "688999184372",
            appId: "1:688999184372:web:ff9a4651af0ca860386ba1"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        // === ZObase ===
        const BASE_URL = "https://zoro-game.store";
        const DB_URL = "https://zoro-game.store/data/ZObase.json";
        let gamesData = [];
        let allCategories = new Set();
        let dbLoaded = false;

        let currentUser = null;
        let currentGameId = null;
        let pendingScore = 0;
        let reviewsRef = null;

        // === THEME ===
        function initTheme() {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('header-logo').src = isDark ? 'logo-dark.png' : 'logo.png';
        }
        initTheme();

        // === AUTH OBSERVER ===
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).once('value').then(snapshot => {
                    const data = snapshot.val();
                    currentUser = {
                        uid: user.uid,
                        email: user.email,
                        nickname: (data && data.nickname) || user.email.split('@')[0],
                        avatar: data ? data.avatar : '',
                        subs: (data && data.subs) || 3,
                        subing: (data && data.subing) || 1,
                        friends: (data && data.friends) || 1
                    };
                    updateAuthButton();
                });
            } else {
                currentUser = null;
                updateAuthButton();
            }
        });

        function updateAuthButton() {
            const btn = document.getElementById('auth-btn');
            if (currentUser) {
                btn.innerHTML = `<span class="material-icons-outlined">account_circle</span><span>${currentUser.nickname}</span>`;
                btn.onclick = (e) => { e.preventDefault(); navigate('/profile'); };
            } else {
                btn.innerHTML = `<span class="material-icons-outlined">account_circle</span><span>Войти</span>`;
                btn.onclick = (e) => { e.preventDefault(); openAuthModal(); };
            }
        }

        // === ROUTING ===
        function handleRouting() {
            const path = window.location.pathname;
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id') || params.get('game');

            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('active');
                const href = a.getAttribute('href');
                if ((path === '/' && href === '/') || (href !== '/' && !href.startsWith('http') && path.startsWith(href))) {
                    a.classList.add('active');
                }
            });

            if (!dbLoaded) return;

            if (path === '/' || path === '/games' || path === '' || path.endsWith('index.html')) renderHome();
            else if (path === '/game' && gameId) renderGameDetail(gameId);
            else if (path === '/profile') renderProfile();
            else if (path === '/console') renderConsole();
            else document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px"><h1>404</h1><p style="color:var(--text-secondary)">Страница не найдена</p></div>';
        }

        function navigate(path) {
            history.pushState({}, '', path);
            handleRouting();
            window.scrollTo(0, 0);
        }
        window.onpopstate = handleRouting;
        window.navigate = navigate;

        // === ЗАГРУЗКА ZObase.json ===
        async function loadDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error('HTTP ' + response.status);
                const data = await response.json();
                
                gamesData = Array.isArray(data) ? data : (data.games || []);
                if (gamesData.length === 0) throw new Error('База пуста');

                gamesData.forEach(game => {
                    if (game["#"]) {
                        game["#"].split(',').forEach(c => { if (c.trim()) allCategories.add(c.trim()); });
                    }
                });

                dbLoaded = true;
                handleRouting();
            } catch (error) {
                console.error(error);
                const errBox = document.getElementById('error-box');
                errBox.style.display = 'block';
                errBox.innerHTML = '<span class="material-icons" style="vertical-align: middle; margin-right: 8px">error</span>Ошибка загрузки ZObase.json: ' + error.message;
            }
        }

        // === ГЛАВНАЯ ===
        function renderHome() {
            let options = '<option value="all">Все категории</option>';
            allCategories.forEach(c => { options += `<option value="${c}">${c}</option>`; });

            document.getElementById('app').innerHTML = `
                <div class="search-bar-container">
                    <div class="search-row">
                        <input class="search-input" placeholder="Поиск игр, разработчиков..." id="search-input">
                        <select class="category-select" id="category-select">${options}</select>
                    </div>
                </div>
                <h2 style="font-size:20px; margin-bottom:15px; display: flex; align-items: center; gap: 8px"><span class="material-icons-outlined">whatshot</span>${window.location.pathname.includes('games') ? 'Каталог игр' : 'Популярное'}</h2>
                <div class="games-grid" id="games-grid"></div>
            `;
            
            renderCatalog(gamesData);
            
            const applyFilters = () => {
                const term = document.getElementById('search-input').value.toLowerCase();
                const cat = document.getElementById('category-select').value;
                let filtered = gamesData;
                if (cat !== 'all') filtered = filtered.filter(g => g["#"] && g["#"].includes(cat));
                if (term) filtered = filtered.filter(g => (g.title && g.title.toLowerCase().includes(term)) || (g.DEVELOPER && g.DEVELOPER.toLowerCase().includes(term)));
                renderCatalog(filtered);
            };
            document.getElementById('search-input').addEventListener('input', applyFilters);
            document.getElementById('category-select').addEventListener('change', applyFilters);
        }

        function renderCatalog(list) {
            const grid = document.getElementById('games-grid');
            if (!grid) return;
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary)"><span class="material-icons-outlined" style="font-size: 48px; display: block; margin-bottom: 10px">search_off</span>Ничего не найдено</div>';
                return;
            }
            const fallback = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTUwIj48cmVjdCB3aWR0aD0iMjAwIiBoZWlnaHQ9IjE1MCIgZmlsbD0iIzJhMmEzNSIvPjwvc3ZnPg==';
            
            list.forEach(game => {
                let imgUrl = game.IconGame || '';
                if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;

                        </div>

        // === СТРАНИЦА ИГРЫ ===
        function renderGameDetail(id) {
            const game = gamesData.find(g => g.id == id);

                document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px"><span class="material-icons" style="font-size: 48px; color: var(--accent-red)">error</span><h1>Игра не найдена</h1><a class="btn-action btn-primary" onclick="navigate(\'/\')"><span class="material-icons-outlined">home</span>На главную</a></div>';

                        </div>
                        
                        <div class="btn-row">

                            <div><span style="color:var(--text-secondary)">Версия:</span> <strong>${ver}</strong></div>
                        </div>
                        
                        <div class="detail-section"><h3><span class="material-icons-outlined">description</span>Описание</h3><p>${game.descr || 'Нет описания.'}</p></div>
                        
                        ${galleryHtml ? `<div class="detail-section"><h3><span class="material-icons-outlined">photo_library</span>Скриншоты</h3><div class="gallery-grid">${galleryHtml}</div></div>` : ''}
                        
                        <!-- ДОПОЛНИТЕЛЬНЫЕ ФАЙЛЫ -->
                        ${additionalFilesHtml ? `
                        <div class="detail-section">

                            <div class="additional-files">${additionalFilesHtml}</div>

                        ` : ''}
                        
                        <div class="detail-section">
                            <h3><span class="material-icons-outlined">update</span>Последнее обновление (v${ver})</h3>
                            <p>${game.UPDATES_descr || 'Нет данных.'}</p>
                        </div>
                        
                        <div class="detail-section">
                            <h3><span class="material-icons-outlined">bug_report</span>Баги</h3>
                            <p style="color:var(--accent-red)">${game.bugs || 'Известных багов не обнаружено.'}</p>
                        </div>
                        
                        <div class="detail-section">
                            <h3><span class="material-icons-outlined">share</span>Поделиться</h3>
                            <div class="btn-row">
                                ${shareButtons.map(b => b.action === 'copy' 
                                    ? `<button class="download-btn library-btn" onclick="navigator.clipboard.writeText('${window.location.origin}/game?id=${game.id}').then(()=>alert('Ссылка скопирована!'))"><span class="material-icons-outlined">${b.icon}</span>${b.name}</button>`
                                    : `<a href="${b.url}" target="_blank" class="download-btn library-btn"><span class="material-icons-outlined">${b.icon}</span>${b.name}</a>`
                                ).join('')}
                            </div>
                        </div>

                            <h3><span class="material-icons-outlined">rate_review</span>Оценить игру</h3>
                            <div class="rating-controls">
                                <button class="rate-btn rate-pos" onclick="openReviewModal(10)"><span class="material-icons">thumb_up</span>Положительная</button>
                                <button class="rate-btn rate-neu" onclick="openReviewModal(5)"><span class="material-icons">remove</span>Нейтральная</button>
                                <button class="rate-btn rate-neg" onclick="openReviewModal(-10)"><span class="material-icons">thumb_down</span>Отрицательная</button>
                            </div>
                            <h3><span class="review-live-indicator"></span><span class="material-icons-outlined">reviews</span>Отзывы</h3>
                            <div id="reviews-container" class="review-list"><div style="text-align:center;color:var(--text-secondary);padding:20px"><span class="material-icons" style="font-size: 32px; display: block; margin-bottom: 10px">sync</span>Подключение...</div></div>
                        </div>
                    </div>
                </div>
            `;
            updateLibraryButton(game.id);
            loadReviewsRealtime(game.id);
        }

        // === БИБЛИОТЕКА ===
        window.toggleLibrary = (gameId) => {
            if (!currentUser) { alert('Войдите, чтобы добавить игру в библиотеку!'); openAuthModal(); return; }
            const ref = db.ref('library/' + currentUser.uid + '/' + gameId);
            ref.once('value').then(snap => {
                if (snap.exists()) { ref.remove().then(() => updateLibraryButton(gameId)); }
                else { ref.set({ gameId: gameId, added_at: Date.now() }).then(() => updateLibraryButton(gameId)); }
            });
        };

        function updateLibraryButton(gameId) {
            const btn = document.getElementById('library-btn');
            if (!btn) return;
            if (!currentUser) { btn.innerHTML = '<span class="material-icons-outlined">add_to_queue</span>В библиотеку'; btn.classList.remove('in-library'); return; }
            db.ref('library/' + currentUser.uid + '/' + gameId).once('value').then(snap => {
                if (snap.exists()) {
                    btn.innerHTML = '<span class="material-icons">check_circle</span>В библиотеке';
                    btn.classList.add('in-library');
                } else {
                    btn.innerHTML = '<span class="material-icons-outlined">add_to_queue</span>В библиотеку';
                    btn.classList.remove('in-library');
                }
            });
        }

        // === ОТЗЫВЫ ===
        function loadReviewsRealtime(gameId) {
            const container = document.getElementById('reviews-container');
            if (!container) return;
            if (reviewsRef) reviewsRef.off();
            
            reviewsRef = db.ref('reviews/' + gameId);
            reviewsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let html = '';
                if (data) {
                    const reviews = Object.values(data).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                    reviews.forEach(r => {
                        const scoreClass = r.score > 0 ? 'score-pos' : (r.score < 0 ? 'score-neg' : 'score-neu');
                        const scoreText = r.score > 0 ? 'Положительный' : (r.score < 0 ? 'Отрицательный' : 'Нейтральный');
                        const scoreIcon = r.score > 0 ? 'thumb_up' : (r.score < 0 ? 'thumb_down' : 'remove');
                        const date = r.timestamp ? new Date(r.timestamp).toLocaleDateString('ru-RU') : '';
                        html += `<div class="review-item"><div class="review-header"><span class="review-author"><span class="material-icons-outlined icon-sm">person</span>${r.userName}</span><span class="review-score ${scoreClass}"><span class="material-icons icon-sm">${scoreIcon}</span>${scoreText} • ${date}</span></div><div class="review-text">${r.text}</div></div>`;
                    });
                }
                container.innerHTML = html || '<div style="text-align:center;color:var(--text-secondary);padding:20px"><span class="material-icons-outlined" style="font-size: 32px; display: block; margin-bottom: 10px">rate_review</span>Отзывов пока нет. Будьте первым!</div>';
            });
        }

        window.openReviewModal = (score) => {
            if (!currentUser) { alert('Войдите, чтобы оставить отзыв!'); openAuthModal(); return; }
            pendingScore = score;
            const icons = { 10: 'thumb_up', 5: 'remove', '-10': 'thumb_down' };
            const titles = { 10: 'Положительный отзыв', 5: 'Нейтральный отзыв', '-10': 'Отрицательный отзыв' };
            document.getElementById('review-type-title').innerHTML = `<span class="material-icons-outlined">${icons[score]}</span>${titles[score]}`;
            document.getElementById('review-modal').style.display = 'flex';
        };

        window.submitReview = () => {
            const text = document.getElementById('review-text').value;
            if (!text) return alert('Введите текст отзыва');
            db.ref('reviews/' + currentGameId).push().set({
                userId: currentUser.uid, userName: currentUser.nickname, score: pendingScore, text: text, timestamp: Date.now()
            }).then(() => { closeModal('review-modal'); document.getElementById('review-text').value = ''; });
        };

        // === AUTH ===
        window.openAuthModal = () => { if (currentUser) return navigate('/profile'); document.getElementById('auth-modal').style.display = 'flex'; switchAuthMode('register'); };
        window.switchAuthMode = (mode) => {
            document.getElementById('register-step').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('login-step').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('auth-title').innerHTML = mode === 'register' ? '<span class="material-icons-outlined">person_add</span>Регистрация на ZGS' : '<span class="material-icons-outlined">login</span>Вход на ZGS';
        };

        window.performRegister = () => {
            const email = document.getElementById('reg-email').value.trim();
            const password = document.getElementById('reg-pass').value;
            const confirm = document.getElementById('reg-pass-confirm').value;
            if (!email) return alert('Введите E-mail');
            if (password.length < 6) return alert('Пароль минимум 6 символов');
            if (password !== confirm) return alert('Пароли не совпадают');
            
            auth.createUserWithEmailAndPassword(email, password).then((cred) => {
                const nick = email.split('@')[0];
                db.ref('users/' + cred.user.uid).set({ uid: cred.user.uid, nickname: nick, email: email, avatar: '', subs: 3, subing: 1, friends: 1, library_count: 0, games_created: 0, created_at: Date.now() });
                emailjs.send("service_511hi6d", "template_hln04ip", { to_name: nick, to_email: email, reply_to: email }).catch(e => console.error('EmailJS:', e));
                closeModal('auth-modal');
            }).catch(err => alert({ 'auth/email-already-in-use': 'Email уже зарегистрирован', 'auth/invalid-email': 'Неверный email', 'auth/weak-password': 'Пароль слишком слабый' }[err.code] || err.message));
        };

        window.performLogin = () => {
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-pass').value;
            if (!email || !password) return alert('Введите email и пароль');
            auth.signInWithEmailAndPassword(email, password).then(() => closeModal('auth-modal')).catch(err => alert({ 'auth/user-not-found': 'Пользователь не найден', 'auth/wrong-password': 'Неверный пароль', 'auth/invalid-credential': 'Неверный email или пароль' }[err.code] || err.message));
        };

        window.resetPassword = () => {
            const email = prompt('Введите E-mail:');
            if (!email) return;
            auth.sendPasswordResetEmail(email).then(() => alert('Письмо отправлено!')).catch(err => alert(err.message));
        };

        window.logout = () => auth.signOut().then(() => navigate('/'));

        // === ПРОФИЛЬ ===
        function renderProfile() {
            if (!currentUser) { openAuthModal(); return; }
            const avatar = currentUser.avatar || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48Y2lyY2xlIGN4PSI2MCIgY3k9IjYwIiByPSI2MCIgZmlsbD0iIzMzMyIvPjwvc3ZnPg==';
            
            document.getElementById('app').innerHTML = `
                <div class="profile-header">
                    <button class="back-nav-btn" onclick="navigate('/')"><span class="material-icons-outlined">arrow_back</span>Назад</button>
                    <img src="${avatar}" class="profile-avatar-large" id="profile-avatar">
                    <div class="profile-info">
                        <h1><span class="material-icons">account_circle</span>${currentUser.nickname}</h1>
                        <div class="profile-status"><span class="material-icons icon-sm">offline_bolt</span>Не в сети</div>
                        <div class="profile-stats-row">
                            <div class="stat-box"><span class="stat-val">${currentUser.subs}</span><span class="stat-lbl"><span class="material-icons-outlined icon-sm">person_add</span>Подписчиков</span></div>
                            <div class="stat-box"><span class="stat-val">${currentUser.subing}</span><span class="stat-lbl"><span class="material-icons-outlined icon-sm">person_outline</span>Подписок</span></div>
                            <div class="stat-box"><span class="stat-val">${currentUser.friends}</span><span class="stat-lbl"><span class="material-icons-outlined icon-sm">people</span>Друзей</span></div>
                        </div>
                        <div class="profile-actions">
                            <button class="btn-action btn-primary" onclick="openShareModal('profile')"><span class="material-icons-outlined">share</span>Поделиться</button>
                            <button class="btn-action btn-secondary" onclick="alert('Функция в разработке')"><span class="material-icons-outlined">edit</span>Редактировать</button>
                            <button class="btn-action btn-danger" onclick="logout()"><span class="material-icons-outlined">logout</span>Выйти</button>
                        </div>
                    </div>
                </div>
                <div style="display:grid; grid-template-columns:1fr; gap:15px">
                    <div class="detail-section"><h3><span class="material-icons-outlined">library_books</span>Библиотека игр</h3><div id="library-list"><div style="text-align:center;color:var(--text-secondary);padding:15px"><span class="material-icons" style="font-size: 32px; display: block; margin-bottom: 10px">sync</span>Загрузка...</div></div></div>
                    <div class="detail-section"><h3><span class="material-icons-outlined">videogame_asset</span>Игры созданные при участии</h3><p>0</p></div>
                </div>
            `;
            loadLibrary();
        }

        function loadLibrary() {
            const container = document.getElementById('library-list');
            if (!container || !currentUser) return;
            db.ref('library/' + currentUser.uid).once('value').then(snap => {
                const data = snap.val();
                if (!data) { container.innerHTML = '<p style="color:var(--text-secondary); text-align: center;"><span class="material-icons-outlined" style="font-size: 32px; display: block; margin-bottom: 10px">library_add</span>Нет игр в библиотеке</p>'; return; }
                const fallback = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI2NCIgaGVpZ2h0PSIzNiI+PHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjM2IiBmaWxsPSIjMzMzIi8+PC9zdmc+';
                let html = '';
                Object.values(data).forEach(item => {
                    const game = gamesData.find(g => g.id == item.gameId);
                    if (game) {
                        let imgUrl = game.IconGame || '';
                        if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
                        html += `<div class="library-item" onclick="navigate('/game?id=${game.id}')"><img src="${imgUrl || fallback}" onerror="this.src='${fallback}'"><div><div class="lib-title">${game.title}</div><div class="lib-cat">${game["#"] ? game["#"].split(',')[0] : 'GAME'}</div></div></div>`;
                    }
                });
                container.innerHTML = html || '<p style="color:var(--text-secondary); text-align: center;"><span class="material-icons-outlined" style="font-size: 32px; display: block; margin-bottom: 10px">library_add</span>Нет игр в библиотеке</p>';
            });
        }

        window.openShareModal = (type) => {
            const url = encodeURIComponent(window.location.origin + (type === 'profile' ? '/profile' : '/game?id=' + currentGameId));
            const title = encodeURIComponent('ZORO STORE');
            const buttons = [
                { name: 'Telegram', icon: 'send', url: `https://t.me/share/url?url=${url}&text=${title}` },
                { name: 'VK', icon: 'share', url: `https://vk.com/share.php?url=${url}&title=${title}` },
                { name: 'WhatsApp', icon: 'chat', url: `https://api.whatsapp.com/send?text=${title}%20${url}` },
                { name: 'Копировать', icon: 'content_copy', action: 'copy' }
            ];
            document.getElementById('share-buttons').innerHTML = buttons.map(b => 
                `<div class="share-btn" ${b.action === 'copy' ? `onclick="navigator.clipboard.writeText('${window.location.origin}${type === 'profile' ? '/profile' : '/game?id=' + currentGameId}').then(()=>{alert('Скопировано!');closeModal('share-modal');})"` : `onclick="window.open('${b.url}','_blank')"`}>
                    <span class="material-icons-outlined">${b.icon}</span><span>${b.name}</span>
                </div>`
            ).join('');
            document.getElementById('share-modal').style.display = 'flex';
        };

        // === КОНСОЛЬ ===

            document.getElementById('app').innerHTML = `
                <div style="text-align:center; padding:40px 20px; background:var(--card-bg); border-radius:var(--border-radius); border:1px solid var(--border-color); margin-bottom:25px">
                    <h1 style="font-size:28px; margin-bottom:10px"><span class="material-icons" style="vertical-align: middle; margin-right: 8px">dashboard</span>ZORO CONSOLE</h1>
                    <p style="color:var(--text-secondary)">Присоединяйся к нашему сообществу</p>
                    <div class="console-stats">
                        <div><span class="stat-num">250+</span><span class="stat-label"><span class="material-icons-outlined icon-sm">people</span>пользователей</span></div>
                        <div><span class="stat-num">120+</span><span class="stat-label"><span class="material-icons-outlined icon-sm">games</span>игр</span></div>
                        <div><span class="stat-num">90+</span><span class="stat-label"><span class="material-icons-outlined icon-sm">person</span>разработчиков</span></div>
                    </div>
                </div>
                <div class="features-grid">
                    <div class="feature-card"><span class="material-icons feature-icon">rocket_launch</span><div class="feature-title">Быстрая публикация</div><div class="feature-desc">Ваша игра будет опубликована в течение 24 часов после модерации.</div></div>
                    <div class="feature-card"><span class="material-icons feature-icon">workspace_premium</span><div class="feature-title">Монетизация</div><div class="feature-desc">Получайте доход от своих игр через нашу партнерскую программу.</div></div>
                    <div class="feature-card"><span class="material-icons feature-icon">people</span><div class="feature-title">Сообщество</div><div class="feature-desc">Получайте обратную связь от тысяч игроков и разработчиков.</div></div>
                    <div class="feature-card"><span class="material-icons feature-icon">code</span><div class="feature-title">HTML встраивание</div><div class="feature-desc">Редактируйте страницу игры через собственный HTML код.</div></div>
                </div>
                <div class="pro-banner">
                    <div class="pro-title"><span class="material-icons">local_fire_department</span>Тариф «Rocket» — 100₽/мес</div>
                    <ul class="pro-list">
                        <li><span class="material-icons">check</span>Анимированная аватарка</li><li><span class="material-icons">check</span>Анимированный фон</li><li><span class="material-icons">check</span>До 4 ссылок</li><li><span class="material-icons">check</span>До 6 доп. файлов</li><li><span class="material-icons">check</span>ИКИ лимит до 5</li><li><span class="material-icons">check</span>Хранилище 4 ГБ</li>
                    </ul>
                </div>
                <div class="detail-section">
                    <h3><span class="material-icons-outlined">cloud_upload</span>Выложи свою игру</h3>
                    <p style="color:var(--text-secondary); margin:15px 0">Заполни форму через бота — после модерации твоя игра появится на Zoro game store.</p>
                    <a href="https://t.me/Peach_zgs_bot" class="download-btn" target="_blank"><span class="material-icons-outlined">send</span>Открыть бота</a>
                </div>
            `;
        }

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';
        window.addEventListener('beforeunload', () => { if (reviewsRef) reviewsRef.off(); });

        handleRouting();
        loadDatabase();
    </script>
</body>
