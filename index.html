<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO STORE</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a20;
            --header-bg: #131318;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-red: #d93025;
            --accent-green: #4caf50;
            --accent-yellow: #fdd835;
            --accent-blue: #5c6bc0;
            --accent-purple: #9c27b0;
            --input-bg: #25252e;
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { background-color: var(--header-bg); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #25252e; backdrop-filter: blur(10px); }
        .logo { font-size: 22px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; cursor: pointer; text-decoration: none; color: white; transition: opacity 0.2s; }
        .logo:hover { opacity: 0.8; }
        .logo span { color: var(--accent-blue); }
        
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--text-secondary); font-size: 15px; font-weight: 500; transition: color 0.2s; cursor: pointer; position: relative; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: var(--accent-blue); border-radius: 2px; }
        
        .profile-btn { background-color: #25252e; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: white; transition: background 0.2s; }
        .profile-btn:hover { background-color: #353540; }

        /* Main */
        main { flex: 1; padding: 30px 40px; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        /* --- HOME & GAMES PAGE STYLES --- */
        .search-bar-container { display: flex; gap: 15px; margin-bottom: 30px; flex-wrap: wrap; align-items: center; animation: fadeIn 0.4s ease; }
        .search-input { flex: 1; min-width: 250px; background-color: var(--input-bg); border: none; padding: 12px 20px; border-radius: 25px; color: white; font-size: 14px; outline: none; transition: box-shadow 0.2s; }
        .search-input:focus { box-shadow: 0 0 0 2px var(--accent-blue); }
        
        .filters { display: flex; gap: 10px; flex-wrap: wrap; }
        .filter-tag { background-color: var(--input-bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; cursor: pointer; transition: all 0.2s; color: var(--text-secondary); user-select: none; border: 1px solid transparent; }
        .filter-tag:hover { background-color: #353540; }
        .filter-tag.active { background-color: var(--accent-red); color: white; border-color: var(--accent-red); }

        .section-title { font-size: 24px; margin: 40px 0 20px; font-weight: 700; color: var(--text-main); animation: fadeIn 0.5s ease; }
        
        .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; }
        
        .game-card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; animation: fadeIn 0.5s ease; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
        
        .card-image { width: 100%; height: 160px; background-color: #2a2a35; object-fit: cover; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-content { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 16px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-category { font-size: 12px; color: var(--accent-yellow); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .card-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-secondary); border-top: 1px solid #2a2a35; padding-top: 10px; margin-top: auto; }
        .iki-badge { background-color: rgba(217, 48, 37, 0.1); color: var(--accent-red); padding: 2px 8px; border-radius: 4px; font-weight: 700; }

        /* --- GAME DETAIL PAGE STYLES --- */
        .detail-header { display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; animation: fadeIn 0.4s ease; }
        .detail-image { width: 300px; height: 400px; background-color: #2a2a35; border-radius: var(--border-radius); overflow: hidden; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        
        .detail-info { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .detail-title { font-size: 32px; font-weight: 800; line-height: 1.2; }
        .detail-meta { display: flex; gap: 15px; font-size: 14px; color: var(--text-secondary); flex-wrap: wrap; }
        .tag-pill { background-color: #25252e; padding: 4px 12px; border-radius: 15px; font-size: 12px; border: 1px solid #333; }
        
        .download-btn { background-color: var(--accent-green); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; margin-top: 10px; transition: opacity 0.2s, transform 0.2s; }
        .download-btn:hover { opacity: 0.9; transform: scale(1.02); }
        
        .detail-section { background-color: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; animation: fadeIn 0.5s ease; }
        .detail-section h3 { margin-bottom: 10px; font-size: 18px; color: var(--text-main); border-bottom: 1px solid #333; padding-bottom: 8px; }
        .detail-section p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-wrap; }
        
        .share-links { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
        .share-link { color: var(--text-secondary); text-decoration: none; font-size: 13px; border: 1px solid #333; padding: 5px 10px; border-radius: 4px; transition: all 0.2s; }
        .share-link:hover { border-color: var(--accent-blue); color: var(--accent-blue); background: rgba(92, 107, 192, 0.1); }

        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; margin-top: 15px; }
        .gallery-item { aspect-ratio: 16/9; background: #2a2a35; border-radius: 8px; overflow: hidden; cursor: zoom-in; transition: transform 0.2s; }
        .gallery-item:hover { transform: scale(1.05); z-index: 10; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }

        /* --- CONSOLE PAGE STYLES --- */
        .console-hero {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: var(--border-radius);
            padding: 40px;
            margin-bottom: 30px;
            text-align: center;
            border: 1px solid #25252e;
            animation: fadeIn 0.5s ease;
        }
        .console-stats { display: flex; justify-content: center; gap: 40px; margin-top: 20px; flex-wrap: wrap; }
        .stat-item { text-align: center; }
        .stat-num { font-size: 28px; font-weight: 800; color: var(--accent-blue); display: block; }
        .stat-label { font-size: 14px; color: var(--text-secondary); }

        .features-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .feature-card { background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); border: 1px solid #25252e; transition: transform 0.2s; animation: fadeIn 0.5s ease; }
        .feature-card:hover { transform: translateY(-3px); border-color: var(--accent-blue); }
        .feature-icon { font-size: 32px; margin-bottom: 15px; display: block; }
        .feature-title { font-size: 18px; font-weight: 700; margin-bottom: 10px; color: var(--text-main); }
        .feature-desc { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

        .pro-banner {
            background: linear-gradient(45deg, #2c1a4d, #4a148c);
            padding: 30px;
            border-radius: var(--border-radius);
            margin-bottom: 40px;
            border: 1px solid #9c27b0;
            animation: fadeIn 0.6s ease;
        }
        .pro-title { font-size: 22px; font-weight: 800; color: #e1bee7; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .pro-list { list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
        .pro-list li { color: #fff; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .pro-list li::before { content: '🔥'; }

        .upload-form { background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); border: 1px solid #25252e; animation: fadeIn 0.6s ease; }
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text-main); }
        .form-input, .form-textarea { width: 100%; background: var(--input-bg); border: 1px solid #333; padding: 12px; border-radius: 8px; color: white; font-size: 14px; outline: none; transition: border 0.2s; }
        .form-input:focus, .form-textarea:focus { border-color: var(--accent-blue); }
        .form-textarea { min-height: 100px; resize: vertical; }
        .file-drop { border: 2px dashed #444; padding: 30px; text-align: center; border-radius: 8px; color: var(--text-secondary); cursor: pointer; transition: all 0.2s; }
        .file-drop:hover { border-color: var(--accent-blue); background: rgba(92, 107, 192, 0.05); }
        .submit-btn { background: var(--accent-blue); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; }
        .submit-btn:hover { background: #3f51b5; }

        /* --- GENERIC PLACEHOLDER --- */
        .page-placeholder { text-align: center; padding: 60px 20px; animation: fadeIn 0.4s ease; }
        .page-placeholder h1 { font-size: 36px; margin-bottom: 15px; color: var(--text-main); }
        .page-placeholder p { color: var(--text-secondary); max-width: 600px; margin: 0 auto 30px; font-size: 16px; }
        .action-btn { background: var(--accent-blue); color: white; padding: 12px 24px; border-radius: 8px; text-decoration: none; display: inline-block; font-weight: 600; transition: background 0.2s; }
        .action-btn:hover { background: #3f51b5; }

        .loading-screen { display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 18px; color: var(--text-secondary); flex-direction: column; gap: 10px; }
        .error-msg { color: var(--accent-red); font-size: 14px; max-width: 600px; text-align: center; background: rgba(217, 48, 37, 0.1); padding: 15px; border-radius: 8px; display: none; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); text-decoration: none; margin-bottom: 20px; cursor: pointer; font-size: 14px; transition: color 0.2s; }
        .back-btn:hover { color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { gap: 15px; font-size: 13px; }
            main { padding: 20px; }
            .detail-header { flex-direction: column; }
            .detail-image { width: 100%; height: 250px; }
            .detail-title { font-size: 24px; }
            .console-stats { gap: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo" onclick="navigate('/')">ZORO <span>STORE</span></a>
        <nav>
            <ul>
                <li><a href="/" onclick="navigate('/')">Главная</a></li>
                <li><a href="/games" onclick="navigate('/games')">Игры</a></li>
                <li><a href="/console" onclick="navigate('/console')">Консоль</a></li>
                <li><a href="https://t.me/Zoro_service" target="_blank">Сообщество</a></li>
            </ul>
        </nav>
        <a href="/profile" onclick="navigate('/profile')" class="profile-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span style="margin-left: 5px;">Профиль</span>
        </a>
    </header>

    <main id="app">
        <!-- Loading State -->
        <div id="loading" class="loading-screen">
            <div>Загрузка системы ZORO...</div>
            <div id="error-box" class="error-msg"></div>
        </div>
        
        <!-- Content injected by JS -->
    </main>

    <script>
        const BASE_URL = "https://zoro-game.store";
        const DB_URL = "https://zoro-game.store/data/ZObase.json";
        
        let gamesData = [];
        let allCategories = new Set();
        const app = document.getElementById('app');

        // --- ROUTING SYSTEM ---
        function handleRouting() {
            const path = window.location.pathname;
            const searchParams = new URLSearchParams(window.location.search);
            const gameId = searchParams.get('id') || searchParams.get('game');

            // Update active nav
            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('active');
                const href = a.getAttribute('href');
                if ((path === '/' && href === '/') || 
                    (path.includes(href) && href !== '/' && !href.startsWith('http'))) {
                    a.classList.add('active');
                }
            });

            if (path === '/' || path === '/games' || path === '') {
                renderHome();
            } else if (path === '/game' && gameId) {
                renderGameDetail(gameId);
            } else if (path === '/console') {
                renderConsole();
            } else if (path === '/profile') {
                renderPlaceholder('Профиль', 'Здесь будет ваша статистика, библиотека игр и достижения.', 'Редактировать профиль');
            } else if (path === '/me' || path === '/messages') {
                renderPlaceholder('Сообщения', 'Ваши диалоги с разработчиками появятся здесь.', 'Написать сообщение');
            } else if (path === '/tasks') {
                renderPlaceholder('Задачи', 'Раздел в разработке. Скоро здесь появятся ежедневные квесты!', null);
            } else if (path === '/jems') {
                renderPlaceholder('Игровые джемы', 'Участвуйте в соревнованиях и создавайте игры за 48 часов!', 'Узнать о следующем джеме');
            } else if (path === '/search') {
                renderHome();
                setTimeout(() => {
                    const input = document.querySelector('.search-input');
                    if(input) { input.focus(); }
                }, 100);
            } else if (path === '/wiki-coloda') {
                renderPlaceholder('ВикиZoro', 'База знаний по вселенной Zoro. Статьи, гайды и лор.', 'Читать статьи');
            } else {
                renderPlaceholder('404', 'Страница не найдена или находится в разработке.', 'Вернуться на главную', '/');
            }
        }

        function navigate(path) {
            history.pushState({}, '', path);
            handleRouting();
            window.scrollTo(0, 0);
        }

        window.onpopstate = handleRouting;

        // --- PAGE RENDERERS ---

        function renderHome() {
            if (gamesData.length === 0) return;

            let html = `
                <div style="animation: fadeIn 0.4s ease;">
                    <div class="search-bar-container">
                        <input type="text" class="search-input" placeholder="Поиск игр, разработчиков..." id="search-input">
                        <div class="filters" id="filter-container">
                            <div class="filter-tag active" data-filter="all">Все</div>
                        </div>
                    </div>
                    
                    <h2 class="section-title">${window.location.pathname === '/games' ? 'Каталог игр' : 'Популярное'}</h2>
                    <div class="games-grid" id="games-grid-container"></div>
                </div>
            `;
            app.innerHTML = html;
            
            renderFilters();
            renderCatalog(gamesData);
            
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = gamesData.filter(game => 
                    (game.title && game.title.toLowerCase().includes(term)) || 
                    (game.DEVELOPER && game.DEVELOPER.toLowerCase().includes(term))
                );
                renderCatalog(filtered);
            });
        }

        function renderFilters() {
            const container = document.getElementById('filter-container');
            if (!container) return;
            
            const allBtn = container.querySelector('[data-filter="all"]');
            container.innerHTML = '';
            container.appendChild(allBtn);

            allCategories.forEach(cat => {
                const btn = document.createElement('div');
                btn.className = 'filter-tag';
                btn.textContent = cat;
                btn.dataset.filter = cat;
                btn.onclick = () => filterGames(cat, btn);
                container.appendChild(btn);
            });

            allBtn.onclick = () => filterGames('all', allBtn);
        }

        function filterGames(category, btnElement) {
            document.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');

            if (category === 'all') {
                renderCatalog(gamesData);
            } else {
                const filtered = gamesData.filter(game => {
                    if (!game["#"]) return false;
                    return game["#"].includes(category);
                });
                renderCatalog(filtered);
            }
        }

        function renderCatalog(list) {
            const grid = document.getElementById('games-grid-container');
            if (!grid) return;
            
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">Ничего не найдено</div>';
                return;
            }

            list.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `/game?id=${game.id}`;
                card.onclick = (e) => { e.preventDefault(); navigate(`/game?id=${game.id}`); };
                
                let imgUrl = game.IconGame || '';
                if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
                const fallbackImg = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTUwIiB2aWV3Qm94PSIwIDAgMjAwIDE1MCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxNTAiIGZpbGw9IiMyYTIhMzUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzU1NSIgZm9udC1zaXplPSIyMCI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';

                const categoryText = game["#"] ? game["#"].split(',')[0] : 'GAME';
                const ikiVal = game["ИКИ"] !== undefined ? game["ИКИ"] : 0;

                card.innerHTML = `
                    <div class="card-image">
                        <img src="${imgUrl || fallbackImg}" alt="${game.title}" onerror="this.src='${fallbackImg}'">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${game.title || 'Без названия'}</div>
                        <div class="card-category">${categoryText}</div>
                        <div class="card-desc">${game.descr || 'Нет описания'}</div>
                        <div class="card-footer">
                            <span>${game.DEVELOPER || 'Unknown'}</span>
                            <span class="iki-badge">ИКИ ${ikiVal}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderGameDetail(gameId) {
            const game = gamesData.find(g => g.id == gameId);
            if (!game) {
                app.innerHTML = `<div class="page-placeholder"><h1>Игра не найдена</h1><p>ID ${gameId} отсутствует в базе.</p><a href="/" class="action-btn" onclick="navigate('/')">На главную</a></div>`;
                return;
            }

            let imgUrl = game.IconGame || '';
            if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
            let dlUrl = game.download_link || '#';
            if (dlUrl.startsWith('/')) dlUrl = BASE_URL + dlUrl;
            
            const typeText = game["#"] ? game["#"].split(',')[0] : 'EXE';
            const yearText = game["year of release"] || '2025';
            const ver = game.UPDATES_Vers || '1.0.0';

            // Generate Gallery
            let galleryHtml = '';
            let hasImages = false;
            for (let i = 1; i <= 8; i++) {
                const imgKey = `imag_${i}`;
                if (game[imgKey] && game[imgKey].trim() !== "") {
                    hasImages = true;
                    let src = game[imgKey];
                    if (src.startsWith('/')) src = BASE_URL + src;
                    galleryHtml += `
                        <div class="gallery-item" onclick="window.open('${src}', '_blank')">
                            <img src="${src}" alt="Screenshot ${i}">
                        </div>
                    `;
                }
            }

            // Generate Share Links
            const currentUrl = encodeURIComponent(window.location.origin + window.location.pathname + '?id=' + game.id);
            const shareLinks = [
                { name: 'Telegram', url: `https://t.me/share/url?url=${currentUrl}&text=${encodeURIComponent(game.title)}` },
                { name: 'VK', url: `https://vk.com/share.php?url=${currentUrl}&title=${encodeURIComponent(game.title)}` },
                { name: 'Copy', action: true }
            ];
            let shareHtml = shareLinks.map(link => {
                if (link.action) {
                    return `<a href="#" class="share-link" onclick="event.preventDefault(); navigator.clipboard.writeText('${window.location.origin}/game?id=${game.id}'); alert('Ссылка скопирована!');">Копировать</a>`;
                }
                return `<a href="${link.url}" target="_blank" class="share-link">${link.name}</a>`;
            }).join('');

            app.innerHTML = `
                <a href="/games" class="back-btn" onclick="event.preventDefault(); navigate('/games')">← Назад</a>
                
                <div class="detail-header">
                    <div class="detail-image">

        function renderPlaceholder(title, desc, btnText, btnLink = '#') {
            const btnHtml = btnText ? `<a href="${btnLink}" class="action-btn" ${btnLink === '#' ? 'onclick="event.preventDefault();"' : ''}>${btnText}</a>` : '';
            app.innerHTML = `
                <div class="page-placeholder">
                    <h1>${title}</h1>
                    <p>${desc}</p>
                    ${btnHtml}
                </div>
            `;
        }

        // --- DATA LOADING ---
        async function loadDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                gamesData = Array.isArray(data) ? data : (data.games || []);
                
                if (gamesData.length === 0) throw new Error("База пуста");

                gamesData.forEach(game => {
                    if (game["#"]) {
                        game["#"].split(',').forEach(c => {
                            if(c.trim()) allCategories.add(c.trim());
                        });
                    }
                });

                document.getElementById('loading').style.display = 'none';
                handleRouting(); // Render initial page

            } catch (error) {
                console.error(error);
                const errBox = document.getElementById('error-box');
                errBox.style.display = 'block';
                errBox.innerHTML = `
                    <strong>Ошибка загрузки ZObase.json</strong><br>
                    ${error.message}<br>
                    <small>Убедитесь, что файл доступен по ссылке и сервер разрешает CORS.</small>
                `;
            }
        }

        // Start
        loadDatabase();
    </script>
