<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO STORE</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1a1a20;
            --header-bg: #131318;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-red: #d93025; 
            --accent-red-hover: #b71c1c;
            --accent-green: #4caf50;
            --accent-yellow: #fdd835;
            --input-bg: #25252e;
            --border-radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        header { background-color: var(--header-bg); padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #25252e; backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; gap: 10px; text-decoration: none; color: white; cursor: pointer; }
        .logo-img { height: 40px; width: auto; }
        .logo-text { font-size: 22px; font-weight: 700; letter-spacing: 1px; }
        .logo-text span { color: var(--accent-red); }
        
        nav ul { display: flex; list-style: none; gap: 25px; }
        nav a { text-decoration: none; color: var(--text-secondary); font-size: 15px; font-weight: 500; transition: color 0.2s; cursor: pointer; position: relative; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: var(--accent-red); border-radius: 2px; }
        
        .profile-btn { background-color: #25252e; padding: 8px 20px; border-radius: 20px; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: white; transition: background 0.2s; }
        .profile-btn:hover { background-color: #353540; }

        main { flex: 1; padding: 30px 40px; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        /* --- SEARCH & HORIZONTAL CATEGORIES --- */
        .search-bar-container { display: flex; flex-direction: column; gap: 15px; margin-bottom: 30px; animation: fadeIn 0.4s ease; }
        .search-input { width: 100%; background-color: var(--input-bg); border: none; padding: 14px 24px; border-radius: 25px; color: white; font-size: 15px; outline: none; transition: box-shadow 0.2s; }
        .search-input:focus { box-shadow: 0 0 0 2px var(--accent-red); }
        
        .categories-wrapper { position: relative; width: 100%; overflow: hidden; }
        .categories-scroll { 
            display: flex; 
            gap: 10px; 
            overflow-x: auto; 
            padding: 5px 0 15px 0; 
            scroll-behavior: smooth;
            scrollbar-width: none; /* Firefox */
        }
        .categories-scroll::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        
        .filter-tag { 
            background-color: var(--input-bg); 
            padding: 8px 20px; 
            border-radius: 20px; 
            font-size: 14px; 
            cursor: pointer; 
            transition: all 0.2s; 
            color: var(--text-secondary); 
            white-space: nowrap;
            border: 1px solid transparent;
            user-select: none;
        }
        .filter-tag:hover { background-color: #353540; }
        .filter-tag.active { background-color: var(--accent-red); color: white; border-color: var(--accent-red); transform: scale(1.05); }

        /* --- GRID SYSTEM (5 PC, 3 Tablet, 1 Mobile) --- */
        .section-title { font-size: 24px; margin: 20px 0 20px; font-weight: 700; color: var(--text-main); }
        .games-grid { 
            display: grid; 
            gap: 25px; 
            grid-template-columns: repeat(1, 1fr); /* Mobile default */
        }

        @media (min-width: 768px) and (max-width: 1200px) {
            .games-grid { grid-template-columns: repeat(3, 1fr); } /* Tablet */
        }

        @media (min-width: 1201px) {
            .games-grid { grid-template-columns: repeat(5, 1fr); } /* PC */
        }

        .game-card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; animation: fadeIn 0.5s ease; }
        .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(217, 48, 37, 0.2); }
        .card-image { width: 100%; aspect-ratio: 16/9; background-color: #2a2a35; object-fit: cover; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 15px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 15px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-category { font-size: 11px; color: var(--accent-yellow); margin-bottom: 8px; text-transform: uppercase; font-weight: 600; }
        .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 15px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); border-top: 1px solid #2a2a35; padding-top: 10px; margin-top: auto; }
        .iki-badge { background-color: rgba(217, 48, 37, 0.1); color: var(--accent-red); padding: 2px 6px; border-radius: 4px; font-weight: 700; }

        /* --- GAME DETAIL & REVIEWS --- */
        .detail-header { display: flex; gap: 30px; margin-bottom: 30px; flex-wrap: wrap; animation: fadeIn 0.4s ease; }
        .detail-image { width: 300px; height: 400px; background-color: #2a2a35; border-radius: var(--border-radius); overflow: hidden; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; display: flex; flex-direction: column; gap: 15px; }
        .detail-title { font-size: 32px; font-weight: 800; line-height: 1.2; }
        .detail-meta { display: flex; gap: 15px; font-size: 14px; color: var(--text-secondary); flex-wrap: wrap; }
        .tag-pill { background-color: #25252e; padding: 4px 12px; border-radius: 15px; font-size: 12px; border: 1px solid #333; }
        .download-btn { background-color: var(--accent-red); color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; margin-top: 10px; transition: opacity 0.2s; }
        .download-btn:hover { opacity: 0.9; background-color: var(--accent-red-hover); }
        
        .detail-section { background-color: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; animation: fadeIn 0.5s ease; }
        .detail-section h3 { margin-bottom: 15px; font-size: 18px; color: var(--text-main); border-bottom: 1px solid #333; padding-bottom: 8px; }
        .detail-section p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-wrap; }

        /* Reviews System */
        .rating-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .rate-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; color: white; transition: transform 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .rate-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .rate-pos { background-color: var(--accent-green); }
        .rate-neu { background-color: var(--accent-yellow); color: #333; }
        .rate-neg { background-color: var(--accent-red); }
        
        .review-list { margin-top: 20px; }
        .review-item { background: #25252e; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-red); animation: fadeIn 0.3s; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
        .review-author { font-weight: bold; color: white; }
        .review-score { font-weight: bold; }
        .score-pos { color: var(--accent-green); }
        .score-neu { color: var(--accent-yellow); }
        .score-neg { color: var(--accent-red); }
        .review-text { font-size: 13px; color: var(--text-secondary); }

        /* --- PROFILE STYLES --- */
        .profile-header { display: flex; gap: 30px; margin-bottom: 30px; background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); align-items: center; flex-wrap: wrap; position: relative; }
        .back-nav-btn { position: absolute; top: 20px; left: 20px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 14px; display: flex; align-items: center; gap: 5px; }
        .back-nav-btn:hover { color: white; }
        .profile-avatar-large { width: 150px; height: 150px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent-red); box-shadow: 0 0 20px rgba(217, 48, 37, 0.3); }
        .profile-info { flex: 1; min-width: 250px; }
        .profile-info h1 { font-size: 28px; margin-bottom: 5px; }
        .profile-status { color: var(--accent-red); font-size: 13px; margin-bottom: 15px; display: inline-block; background: rgba(217, 48, 37, 0.1); padding: 2px 8px; border-radius: 4px; }
        .profile-stats-row { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-box { text-align: center; background: #25252e; padding: 8px 15px; border-radius: 8px; min-width: 70px; }
        .stat-val { font-size: 16px; font-weight: bold; color: white; display: block; }
        .stat-lbl { font-size: 11px; color: var(--text-secondary); }
        
        .profile-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .btn-action { padding: 8px 16px; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: 0.2s; color: white; text-decoration: none; }
        .btn-primary { background: var(--accent-red); }
        .btn-primary:hover { background: var(--accent-red-hover); }
        .btn-secondary { background: #25252e; }
        .btn-secondary:hover { background: #353540; }
        .btn-danger { background: #331a1a; color: #ff8a80; }
        .btn-danger:hover { background: #502020; }

        .profile-content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .content-block { background: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; }
        .friend-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid #25252e; }
        .friend-avatar { width: 40px; height: 40px; border-radius: 50%; background: #333; object-fit: cover; }
        .online-dot { width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; margin-left: auto; }

        /* --- LOGIN STYLES --- */
        .login-container { max-width: 400px; margin: 50px auto; background: var(--card-bg); padding: 40px; border-radius: var(--border-radius); text-align: center; border: 1px solid #25252e; }
        .login-title { font-size: 24px; margin-bottom: 20px; color: var(--accent-red); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--input-bg); border: 1px solid #333; border-radius: 6px; color: white; }
        .login-btn { width: 100%; padding: 12px; background: var(--accent-red); border: none; border-radius: 6px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .login-divider { margin: 20px 0; color: var(--text-secondary); font-size: 14px; }
        .login-link { color: var(--accent-red); text-decoration: none; font-weight: 600; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; position: relative; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
        .close-modal:hover { color: white; }

        .loading-screen { display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 18px; color: var(--text-secondary); flex-direction: column; gap: 10px; }
        .error-msg { color: var(--accent-red); font-size: 14px; max-width: 600px; text-align: center; background: rgba(217, 48, 37, 0.1); padding: 15px; border-radius: 8px; display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            header { padding: 15px 20px; }
            nav ul { gap: 15px; font-size: 13px; }
            main { padding: 20px; }
            .detail-header, .profile-header, .profile-content-grid { flex-direction: column; grid-template-columns: 1fr; }
            .detail-image { width: 100%; height: 250px; }
            .profile-avatar-large { width: 120px; height: 120px; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-container" onclick="navigate('/')">
            <img src="logo.png" alt="Zoro Logo" class="logo-img" onerror="this.style.display='none'">
            <div class="logo-text">ZORO <span>STORE</span></div>
        </a>
        <nav>
            <ul>
                <li><a href="/" onclick="navigate('/')">Главная</a></li>
                <li><a href="/games" onclick="navigate('/games')">Игры</a></li>
                <li><a href="/console" onclick="navigate('/console')">Консоль</a></li>
                <li><a href="https://t.me/Zoro_service" target="_blank">Сообщество</a></li>
            </ul>
        </nav>
        <a href="/profile" onclick="navigate('/profile')" class="profile-btn" id="header-profile-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span style="margin-left: 5px;">Профиль</span>
        </a>
    </header>

    <main id="app">
        <div id="loading" class="loading-screen">
            <div>Загрузка системы ZORO...</div>
            <div id="error-box" class="error-msg"></div>
        </div>
    </main>

    <!-- Modal for Lists (Friends, Subscribers etc) -->
    <div id="modal-overlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <h2 id="modal-title" style="margin-bottom: 15px;">Заголовок</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://zoro-game.store";
        const DB_URL = "https://zoro-game.store/data/ZObase.json";
        
        let gamesData = [];
        let allCategories = new Set();
        const app = document.getElementById('app');
        
        // Fake User State
        let currentUser = JSON.parse(localStorage.getItem('zgs_user')) || null;

        // --- ROUTING ---
        function handleRouting() {
            let path = window.location.pathname;
            if (path !== '/' && path.endsWith('/')) path = path.slice(0, -1);
            
            const searchParams = new URLSearchParams(window.location.search);
            const gameId = searchParams.get('id') || searchParams.get('game');

            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('active');
                const href = a.getAttribute('href');
                if ((path === '/' && href === '/') || (path.includes(href) && href !== '/' && !href.startsWith('http'))) {
                    a.classList.add('active');
                }
            });

            // Update Profile Button Text
            const profBtn = document.getElementById('header-profile-btn');
            if(currentUser) {
                profBtn.innerHTML = `<img src="${currentUser.avatar || 'default.png'}" style="width:20px;height:20px;border-radius:50%"> <span style="margin-left:5px">${currentUser.username}</span>`;
            } else {
                profBtn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span style="margin-left:5px">Профиль</span>`;
            }

            if (path === '/' || path === '/games' || path === '' || path.endsWith('index.html')) {
                renderHome();
            } else if (path === '/game' && gameId) {
                renderGameDetail(gameId);
            } else if (path === '/console') {
                renderConsole();
            } else if (path === '/profile') {
                renderProfile();
            } else if (path === '/login') {
                renderLogin();
            } else {
                renderPlaceholder('404', 'Страница не найдена.', 'На главную', '/');
            }
        }

        function navigate(path) {
            history.pushState({}, '', path);
            handleRouting();
            window.scrollTo(0, 0);
        }

        window.onpopstate = handleRouting;

        // --- RENDERERS ---

        function renderHome() {
            if (gamesData.length === 0) return;
            
            // Generate Categories List (Top 6 + All)
            const catsArray = Array.from(allCategories).slice(0, 6);
            let catHtml = `<div class="filter-tag active" data-filter="all">Все</div>`;
            catsArray.forEach(c => {
                catHtml += `<div class="filter-tag" data-filter="${c}">${c}</div>`;
            });

            let html = `
                <div style="animation: fadeIn 0.4s ease;">
                    <div class="search-bar-container">
                        <input type="text" class="search-input" placeholder="Поиск игр, разработчиков..." id="search-input">
                        <div class="categories-wrapper">
                            <div class="categories-scroll" id="filter-container">
                                ${catHtml}
                            </div>
                        </div>
                    </div>
                    <h2 class="section-title">${window.location.pathname.includes('games') ? 'Каталог игр' : 'Популярное'}</h2>
                    <div class="games-grid" id="games-grid-container"></div>
                </div>
            `;
            app.innerHTML = html;
            
            // Init Filters
            const container = document.getElementById('filter-container');
            container.querySelectorAll('.filter-tag').forEach(btn => {
                btn.onclick = () => {
                    container.querySelectorAll('.filter-tag').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    const cat = btn.dataset.filter;
                    if(cat === 'all') renderCatalog(gamesData);
                    else renderCatalog(gamesData.filter(g => g["#"] && g["#"].includes(cat)));
                };
            });

            renderCatalog(gamesData);
            
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = gamesData.filter(g => (g.title && g.title.toLowerCase().includes(term)) || (g.DEVELOPER && g.DEVELOPER.toLowerCase().includes(term)));
                renderCatalog(filtered);
            });
        }

        function renderCatalog(list) {
            const grid = document.getElementById('games-grid-container');
            if (!grid) return;
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:#666">Ничего не найдено</div>';
                return;
            }
            list.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `/game?id=${game.id}`;
                card.onclick = (e) => { e.preventDefault(); navigate(`/game?id=${game.id}`); };
                
                let imgUrl = game.IconGame || '';
                if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
                const fallback = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTUwIiB2aWV3Qm94PSIwIDAgMjAwIDE1MCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxNTAiIGZpbGw9IiMyYTIhMzUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzU1NSIgZm9udC1zaXplPSIyMCI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';
                
                const catText = game["#"] ? game["#"].split(',')[0] : 'GAME';
                const iki = game["ИКИ"] ?? 0;

                card.innerHTML = `
                    <div class="card-image"><img src="${imgUrl || fallback}" onerror="this.src='${fallback}'"></div>
                    <div class="card-content">
                        <div class="card-title">${game.title}</div>
                        <div class="card-category">${catText}</div>
                        <div class="card-desc">${game.descr || ''}</div>
                        <div class="card-footer">
                            <span>${game.DEVELOPER || 'Unknown'}</span>
                            <span class="iki-badge">ИКИ ${iki}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderGameDetail(id) {
            const game = gamesData.find(g => g.id == id);
            if (!game) { app.innerHTML = `<div class="page-placeholder"><h1>Не найдено</h1><a href="/" class="btn-action btn-primary" onclick="navigate('/')">Назад</a></div>`; return; }

            let imgUrl = game.IconGame || '';
            if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
            let dlUrl = game.download_link || '#';
            if (dlUrl.startsWith('/')) dlUrl = BASE_URL + dlUrl;
            
            const type = game["#"] ? game["#"].split(',')[0] : 'EXE';
            const year = game["year of release"] || '2025';
            const ver = game.UPDATES_Vers || '1.0';
            
            // Load reviews from localStorage or init empty
            const reviewsKey = `reviews_${game.id}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];

            // Calculate Average Score logic could go here, but we show individual reviews
            
            let reviewsHtml = '';
            if(reviews.length === 0) {
                reviewsHtml = '<div style="color:#666;text-align:center;padding:20px">Отзывов пока нет. Будьте первым!</div>';
            } else {
                reviews.forEach(r => {
                    let scoreClass = r.score > 0 ? 'score-pos' : (r.score < 0 ? 'score-neg' : 'score-neu');
                    let scoreText = r.score > 0 ? `+${r.score} ИКИ` : `${r.score} ИКИ`;
                    reviewsHtml += `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">${r.author}</span>
                                <span class="review-score ${scoreClass}">${scoreText}</span>
                            </div>
                            <div class="review-text">${r.text}</div>
                        </div>
                    `;
                });
            }

            app.innerHTML = `
                <button class="back-nav-btn" onclick="navigate('/games')">← Назад</button>
                <div class="detail-header">
                    <div class="detail-image"><img src="${imgUrl}" onerror="this.src='${imgUrl}'"></div>
                    <div class="detail-info">
                        <h1 class="detail-title">${game.title}</h1>
                        <div class="detail-meta">
                            <span class="tag-pill">${type}</span>
                            <span class="tag-pill">${year}</span>
                            <span class="tag-pill">${game.DEVELOPER || 'Unknown'}</span>
                        </div>

                            <div><span style="color:#888">Версия:</span> <strong>${ver}</strong></div>
                        </div>

                        <div class="detail-section">
                            <h3>Оценить игру</h3>
                            <div class="rating-controls">
                                <button class="rate-btn rate-pos" onclick="submitReview(${game.id}, 10)"> Положительная (+10)</button>
                                <button class="rate-btn rate-neu" onclick="submitReview(${game.id}, 5)">😐 Нейтральная (+5)</button>
                                <button class="rate-btn rate-neg" onclick="submitReview(${game.id}, -10)">👎 Отрицательная (-10)</button>
                            </div>
                        </div>

                        <div class="detail-section">
                            <h3>Отзывы</h3>
                            <div class="review-list" id="reviews-list-${game.id}">
                                ${reviewsHtml}
                            </div>
                        </div>

                            <h3>Описание</h3>
                            <p>${game.descr || 'Нет описания.'}</p>
                        </div>
                         <div class="detail-section">
                            <h3>Обновление (v${ver})</h3>
                            <p>${game.UPDATES_descr || 'Нет данных.'}</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitReview(gameId, score) {
            if (!currentUser) {
                alert("Для оставления отзыва необходимо войти в аккаунт!");
                navigate('/login');
                return;
            }

            const text = prompt(`Ваш отзыв (${score > 0 ? 'Положительный' : (score < 0 ? 'Отрицательный' : 'Нейтральный')}):`, "");
            if (text === null) return; // Cancelled

            const review = {
                author: currentUser.username,
                score: score,
                text: text || "Без комментария",
                date: new Date().toLocaleDateString()
            };

            const reviewsKey = `reviews_${gameId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            reviews.unshift(review); // Add to top
            localStorage.setItem(reviewsKey, JSON.stringify(reviews));

            // Re-render reviews part
            renderGameDetail(gameId);
        }

        function renderPlaceholder(title, desc, btnText, btnLink) {
            const btn = btnText ? `<a href="${btnLink}" class="btn-action btn-primary" onclick="event.preventDefault(); navigate('${btnLink}')">${btnText}</a>` : '';

        // Modal Logic
        function openModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        // Data Loading
        async function loadDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                gamesData = Array.isArray(data) ? data : (data.games || []);
                
                if (gamesData.length === 0) throw new Error("База пуста");

                gamesData.forEach(game => {
                    if (game["#"]) {
                        game["#"].split(',').forEach(c => {
                            if(c.trim()) allCategories.add(c.trim());
                        });
                    }
                });

                document.getElementById('loading').style.display = 'none';
                handleRouting();

            } catch (error) {
                console.error(error);
                const errBox = document.getElementById('error-box');
                errBox.style.display = 'block';
                errBox.innerHTML = `<strong>Ошибка ZObase.json</strong><br>${error.message}<br><small>Проверьте консоль и CORS.</small>`;
            }
        }

        loadDatabase();
