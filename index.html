<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO STORE</title>
    
    <!-- EmailJS -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function() { 
            emailjs.init("yY04CGM5Tub3olhjG"); 
        })();
    </script>
    
    <style>
        :root {
            --bg-color: #0f0f13; --card-bg: #1a1a20; --header-bg: #131318;
            --text-main: #ffffff; --text-secondary: #a0a0a0;
            --accent-red: #d93025; --accent-red-hover: #b71c1c;
            --accent-green: #4caf50; --accent-yellow: #fdd835;
            --input-bg: #25252e; --border-radius: 12px; --border-color: #25252e;
        }
        [data-theme="light"] {
            --bg-color: #f5f5f7; --card-bg: #ffffff; --header-bg: #ffffff;
            --text-main: #1d1d1f; --text-secondary: #6e6e73;
            --input-bg: #f0f0f5; --border-color: #e0e0e5;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: 0.3s; }
        
        /* Header */
        header { background-color: var(--header-bg); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; text-decoration: none; }
        .logo-img { height: 45px; width: auto; }
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { text-decoration: none; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: 0.2s; cursor: pointer; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: var(--accent-red); }
        .profile-btn { background-color: var(--input-bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text-main); text-decoration: none; }
        
        main { flex: 1; padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        /* Search & Categories */
        .search-bar-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; }
        .search-row { display: flex; gap: 10px; align-items: center; }
        .search-input, .category-select { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 20px; color: var(--text-main); font-size: 14px; outline: none; }
        .search-input { flex: 1; }
        .category-select { min-width: 140px; cursor: pointer; }
        
        /* Grid: 5 PC, 3 Tablet, 1 Mobile */
        .games-grid { display: grid; gap: 20px; grid-template-columns: repeat(1, 1fr); }
        @media (min-width: 768px) { .games-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (min-width: 1201px) { .games-grid { grid-template-columns: repeat(5, 1fr); } }
        
        .game-card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; transition: 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; border: 1px solid var(--border-color); }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .card-image { width: 100%; aspect-ratio: 16/9; background-color: var(--input-bg); object-fit: cover; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-category { font-size: 11px; color: var(--accent-yellow); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 10px; }
        .iki-badge { background-color: rgba(217, 48, 37, 0.15); color: var(--accent-red); padding: 3px 8px; border-radius: 4px; font-weight: 700; }

        /* Detail & Reviews */
        .detail-header { display: flex; gap: 25px; margin-bottom: 25px; flex-wrap: wrap; }
        .detail-image { width: 280px; height: 380px; background-color: var(--input-bg); border-radius: var(--border-radius); overflow: hidden; flex-shrink: 0; }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; min-width: 250px; display: flex; flex-direction: column; gap: 12px; }
        .detail-title { font-size: 28px; font-weight: 800; }
        .download-btn { background-color: var(--accent-red); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; }
        .download-btn:hover { opacity: 0.9; }
        
        .detail-section { background-color: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; border: 1px solid var(--border-color); }
        .detail-section h3 { margin-bottom: 15px; font-size: 17px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .detail-section p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-wrap; }

        .rating-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .rate-btn { flex: 1; min-width: 100px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); background: var(--input-bg); font-size: 13px; }
        .rate-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .rate-pos:hover { background: var(--accent-green); color: white; border-color: var(--accent-green); }
        .rate-neu:hover { background: var(--accent-yellow); color: #333; border-color: var(--accent-yellow); }
        .rate-neg:hover { background: var(--accent-red); color: white; border-color: var(--accent-red); }
        
        .review-list { margin-top: 15px; max-height: 400px; overflow-y: auto; }
        .review-item { background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-red); animation: fadeIn 0.3s; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .review-author { font-weight: 600; color: var(--text-main); }
        .review-score { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        .score-pos { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
        .score-neu { background: rgba(253, 216, 53, 0.2); color: var(--accent-yellow); }
        .score-neg { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }
        .review-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
        .loading-reviews { text-align: center; color: var(--text-secondary); padding: 20px; }
        .review-live-indicator { display: inline-block; width: 8px; height: 8px; background: var(--accent-green); border-radius: 50%; margin-right: 8px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        /* Profile */
        .profile-header { display: flex; gap: 25px; margin-bottom: 25px; background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); align-items: center; flex-wrap: wrap; position: relative; border: 1px solid var(--border-color); }
        .back-nav-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; }
        .back-nav-btn:hover { color: var(--text-main); }
        .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .profile-info { flex: 1; min-width: 200px; }
        .profile-info h1 { font-size: 24px; margin-bottom: 5px; }
        .profile-status { color: var(--text-secondary); font-size: 12px; margin-bottom: 15px; }
        .profile-stats-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { text-align: center; background: var(--input-bg); padding: 8px 14px; border-radius: 8px; min-width: 65px; }
        .stat-val { font-size: 15px; font-weight: 700; color: var(--text-main); display: block; }
        .stat-lbl { font-size: 11px; color: var(--text-secondary); }
        .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn-action { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; color: white; text-decoration: none; font-size: 12px; }
        .btn-primary { background: var(--accent-red); }
        .btn-secondary { background: var(--input-bg); }
        .btn-danger { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }

        /* Auth Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 30px; border-radius: var(--border-radius); width: 90%; max-width: 400px; position: relative; border: 1px solid var(--border-color); text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; color: var(--text-secondary); font-size: 22px; cursor: pointer; }
        .login-title { font-size: 22px; color: var(--accent-red); margin-bottom: 20px; }
        .login-input { width: 100%; padding: 12px; margin: 8px 0; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); }
        .login-btn { width: 100%; padding: 12px; background: var(--accent-red); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; }
        .login-divider { margin: 15px 0; color: var(--text-secondary); font-size: 13px; }
        .login-link { color: var(--accent-red); text-decoration: none; font-weight: 600; cursor: pointer; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 600px) {
            .detail-header, .profile-header { flex-direction: column; }
            .detail-image { width: 100%; height: 220px; }
            .search-row { flex-direction: column; }
            .category-select { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-container" onclick="navigate('/')">
            <img src="logo.png" alt="Logo" class="logo-img" id="header-logo" onerror="this.src='logo-dark.png'">
        </a>
        <nav>
            <ul>
                <li><a href="/" onclick="navigate('/')">Главная</a></li>
                <li><a href="/games" onclick="navigate('/games')">Игры</a></li>
                <li><a href="/console" onclick="navigate('/console')">Консоль</a></li>
            </ul>
        </nav>
        <a href="#" onclick="openAuthModal()" class="profile-btn" id="auth-btn">Войти</a>
    </header>

    <main id="app">
        <div id="loading" style="text-align:center; padding: 50px; color: var(--text-secondary)">Загрузка...</div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('auth-modal')">×</button>
            <h2 class="login-title" id="auth-title">Регистрация на ZGS</h2>
            
            <div id="register-step">
                <input type="email" id="reg-email" class="login-input" placeholder="E-mail">
                <input type="password" id="reg-pass" class="login-input" placeholder="Пароль (мин. 6 символов)">
                <input type="password" id="reg-pass-confirm" class="login-input" placeholder="Повторите пароль">
                <button class="login-btn" onclick="performRegister()">Зарегистрироваться</button>
                <div class="login-divider">или</div>
                <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px">Вспомнили, что у вас есть аккаунт?</p>
                <a class="login-link" onclick="switchAuthMode('login')">Войти</a>
            </div>

            <div id="login-step" style="display:none;">
                <input type="email" id="login-email" class="login-input" placeholder="E-mail">
                <input type="password" id="login-pass" class="login-input" placeholder="Пароль">
                <button class="login-btn" onclick="performLogin()">Войти</button>
                <a class="login-link" onclick="resetPassword()" style="display:block; margin-top:10px; font-size:12px">Забыли пароль?</a>
                <div class="login-divider">или</div>
                <p style="font-size:13px; color:var(--text-secondary); margin-bottom:10px">Нет аккаунта?</p>
                <a class="login-link" onclick="switchAuthMode('register')">Зарегаться</a>
            </div>
        </div>
    </div>

    <!-- Review Modal -->
    <div id="review-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('review-modal')">×</button>
            <h2 class="login-title" id="review-type-title">Отзыв</h2>
            <textarea id="review-text" class="login-input" style="height:100px; resize:none;" placeholder="Напишите ваш отзыв..."></textarea>
            <button class="login-btn" onclick="submitReview()">Отправить</button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // === FIREBASE CONFIG ===
        const firebaseConfig = {
            apiKey: "AIzaSyA-EnR3TP-mxvDYa_2Fd40GnydWzh5ebKY",
            authDomain: "zoro-game-store-rew.firebaseapp.com",
            databaseURL: "https://zoro-game-store-rew-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "zoro-game-store-rew",
            storageBucket: "zoro-game-store-rew.firebasestorage.app",
            messagingSenderId: "688999184372",
            appId: "1:688999184372:web:ff9a4651af0ca860386ba1"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        let currentUser = null;
        let currentGameId = null;
        let pendingScore = 0;
        let reviewsRef = null;

        // Theme Init
        function initTheme() {
            const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('header-logo').src = isDark ? 'logo-dark.png' : 'logo.png';
        }
        initTheme();

        // Auth State Observer
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('users/' + user.uid).once('value').then(snapshot => {
                    const data = snapshot.val();
                    currentUser = {
                        uid: user.uid,
                        email: user.email,
                        nickname: data?.nickname || user.email.split('@')[0],
                        avatar: data?.avatar,
                        subs: data?.subs || 0,
                        subing: data?.subing || 0,
                        friends: data?.friends || 0
                    };
                    updateAuthButton();
                    if (currentGameId) loadReviewsRealtime(currentGameId);
                });
            } else {
                currentUser = null;
                updateAuthButton();
            }
        });

        function updateAuthButton() {
            const btn = document.getElementById('auth-btn');
            if (currentUser) {
                btn.textContent = currentUser.nickname;
                btn.onclick = () => navigate('/profile');
            } else {
                btn.textContent = 'Войти';
                btn.onclick = () => openAuthModal();
            }
        }

        // Routing
        function handleRouting() {
            const path = window.location.pathname;
            const params = new URLSearchParams(window.location.search);
            const gameId = params.get('id');

            if (path === '/' || path === '/games' || path === '') renderHome();
            else if (path === '/game' && gameId) renderGameDetail(gameId);
            else if (path === '/profile') renderProfile();
            else if (path === '/console') renderConsole();
            else if (path === '/login') openAuthModal();
            else document.getElementById('app').innerHTML = '<div style="text-align:center;padding:50px">404</div>';
        }

        function navigate(path) {
            history.pushState({}, '', path);
            handleRouting();
            window.scrollTo(0, 0);
        }
        window.onpopstate = handleRouting;
        window.navigate = navigate;

        // Auth Modal Functions
        window.openAuthModal = () => {
            if (currentUser) return navigate('/profile');
            document.getElementById('auth-modal').style.display = 'flex';
            switchAuthMode('register');
        };

        window.switchAuthMode = (mode) => {
            document.getElementById('register-step').style.display = mode === 'register' ? 'block' : 'none';
            document.getElementById('login-step').style.display = mode === 'login' ? 'block' : 'none';
            document.getElementById('auth-title').textContent = mode === 'register' ? 'Регистрация на ZGS' : 'Вход на ZGS';
        };

        // Регистрация
        window.performRegister = () => {
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-pass').value;
            const passwordConfirm = document.getElementById('reg-pass-confirm').value;
            
            if (!email) return alert('Введите E-mail');
            if (!password) return alert('Введите пароль');
            if (password.length < 6) return alert('Пароль должен быть не менее 6 символов');
            if (password !== passwordConfirm) return alert('Пароли не совпадают');
            
            auth.createUserWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const user = userCredential.user;
                    db.ref('users/' + user.uid).set({
                        nickname: email.split('@')[0],
                        email: email,
                        avatar: '',
                        subs: 0,
                        subing: 0,
                        friends: 0,
                        created_at: Date.now()
                    });
                    
                    // Отправка приветственного письма
                    emailjs.send("YOUR_SERVICE_ID", "YOUR_TEMPLATE_ID", {
                        to_name: email.split('@')[0],
                        to_email: email
                    }).catch(err => console.error('EmailJS Error:', err));
                    
                    closeModal('auth-modal');
                    alert('Аккаунт создан! Добро пожаловать на ZORO STORE!');
                })
                .catch((error) => {
                    let errorMessage = 'Ошибка регистрации: ';
                    switch(error.code) {
                        case 'auth/email-already-in-use': errorMessage += 'Email уже зарегистрирован'; break;
                        case 'auth/invalid-email': errorMessage += 'Неверный формат email'; break;
                        case 'auth/weak-password': errorMessage += 'Пароль слишком слабый'; break;
                        default: errorMessage += error.message;
                    }
                    alert(errorMessage);
                });
        };

        // Вход
        window.performLogin = () => {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-pass').value;
            
            if (!email || !password) return alert('Введите email и пароль');
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    closeModal('auth-modal');
                })
                .catch((error) => {
                    let errorMessage = 'Ошибка входа: ';
                    switch(error.code) {
                        case 'auth/user-not-found': errorMessage += 'Пользователь не найден'; break;
                        case 'auth/wrong-password': errorMessage += 'Неверный пароль'; break;
                        case 'auth/invalid-email': errorMessage += 'Неверный формат email'; break;
                        default: errorMessage += error.message;
                    }
                    alert(errorMessage);
                });
        };

        // Сброс пароля
        window.resetPassword = () => {
            const email = prompt('Введите ваш E-mail для сброса пароля:');
            if (!email) return;
            
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    alert('Письмо для сброса пароля отправлено на ' + email);
                })
                .catch((error) => {
                    alert('Ошибка: ' + error.message);
                });
        };

        // Выход
        window.logout = () => {
            auth.signOut().then(() => {
                currentUser = null;
                updateAuthButton();
                navigate('/');
            });
        };

        // Home Page
        function renderHome() {
            const games = [
                {id: 88, title: "DISK CLEANER PRO", cat: "TOOL", desc: "Лучший клинер", iki: 0},
                {id: 34, title: "Stream", cat: "MESSENGER", desc: "Общайтесь бесплатно", iki: 10},
                {id: 101, title: "Kubby Adventure", cat: "PLATFORMER", desc: "Приключения Кубби", iki: 5}
            ];
            
            let html = `
                <div class="search-bar-container">
                    <div class="search-row">
                        <input class="search-input" placeholder="Поиск игр..." id="search-input">
                        <select class="category-select" id="category-select">
                            <option value="all">Все</option>
                            <option value="TOOL">TOOL</option>
                            <option value="MESSENGER">MESSENGER</option>
                            <option value="PLATFORMER">PLATFORMER</option>
                        </select>
                    </div>
                </div>
                <h2 class="section-title">Популярное</h2>
                <div class="games-grid" id="games-grid"></div>
            `;
            document.getElementById('app').innerHTML = html;
            renderGames(games);
            
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = games.filter(g => g.title.toLowerCase().includes(term));
                renderGames(filtered);
            });
        }

        function renderGames(list) {
            const grid = document.getElementById('games-grid');
            grid.innerHTML = '';
            list.forEach(g => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `/game?id=${g.id}`;
                card.onclick = (e) => { e.preventDefault(); navigate(`/game?id=${g.id}`); };
                card.innerHTML = `
                    <div class="card-image"><div style="width:100%;height:100%;background:#333;display:flex;align-items:center;justify-content:center;color:#777">No Image</div></div>
                    <div class="card-content">
                        <div class="card-title">${g.title}</div>
                        <div class="card-category">${g.cat}</div>
                        <div class="card-desc">${g.desc}</div>
                        <div class="card-footer"><span>Dev</span><span class="iki-badge">ИКИ ${g.iki}</span></div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Game Detail Page
        function renderGameDetail(id) {
            currentGameId = id;
            const gameTitle = "DISK CLEANER PRO";
            
            let html = `
                <button class="back-nav-btn" onclick="navigate('/games')">← Назад</button>
                <div class="detail-header">
                    <div class="detail-image"><div style="width:100%;height:100%;background:#333"></div></div>
                    <div class="detail-info">
                        <h1 class="detail-title">${gameTitle}</h1>
                        <a href="#" class="download-btn">Скачать</a>
                        <div style="color:var(--text-secondary)">ИКИ: <span style="color:var(--accent-red);font-weight:bold">0</span></div>
                        <div class="detail-section"><h3>Описание</h3><p>Самый бесплатный клинер...</p></div>
                        
                        <div class="detail-section">
                            <h3>Оценить игру</h3>
                            <div class="rating-controls">
                                <button class="rate-btn rate-pos" onclick="openReviewModal(10)">Положительная</button>
                                <button class="rate-btn rate-neu" onclick="openReviewModal(5)">Нейтральная</button>
                                <button class="rate-btn rate-neg" onclick="openReviewModal(-10)">Отрицательная</button>
                            </div>
                            
                            <h3><span class="review-live-indicator"></span>Отзывы (Realtime)</h3>
                            <div id="reviews-container" class="review-list">
                                <div class="loading-reviews">Подключение...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
            loadReviewsRealtime(id);
        }

        // REALTIME REVIEWS
        window.loadReviewsRealtime = (gameId) => {
            const container = document.getElementById('reviews-container');
            if (!container) return;
            
            if (reviewsRef) reviewsRef.off();
            
            reviewsRef = db.ref('reviews/' + gameId);
            
            reviewsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                let html = '';
                
                if (data) {
                    const reviews = Object.values(data).sort((a, b) => b.timestamp - a.timestamp);
                    reviews.forEach(r => {
                        const scoreClass = r.score > 0 ? 'score-pos' : (r.score < 0 ? 'score-neg' : 'score-neu');
                        const scoreText = r.score > 0 ? 'Положительный' : (r.score < 0 ? 'Отрицательный' : 'Нейтральный');
                        const date = new Date(r.timestamp).toLocaleDateString('ru-RU');
                        
                        html += `
                            <div class="review-item">
                                <div class="review-header">
                                    <span class="review-author">${r.userName}</span>
                                    <span class="review-score ${scoreClass}">${scoreText} • ${date}</span>
                                </div>
                                <div class="review-text">${r.text}</div>
                            </div>
                        `;
                    });
                }
                
                if (!html) html = '<div style="text-align:center;color:var(--text-secondary);padding:20px">Отзывов пока нет</div>';
                container.innerHTML = html;
            }, (error) => {
                console.error("Realtime Error:", error);
                container.innerHTML = '<div style="text-align:center;color:var(--accent-red);padding:20px">Ошибка загрузки</div>';
            });
        };

        window.openReviewModal = (score) => {
            if (!currentUser) {
                alert("Войдите, чтобы оставить отзыв!");
                openAuthModal();
                return;
            }
            pendingScore = score;
            document.getElementById('review-type-title').textContent = 
                score > 0 ? "Положительный отзыв" : (score < 0 ? "Отрицательный" : "Нейтральный");
            document.getElementById('review-modal').style.display = 'flex';
        };

        window.submitReview = () => {
            const text = document.getElementById('review-text').value;
            if (!text) return alert("Введите текст отзыва");
            if (!currentUser || !currentGameId) return;
            
            const newRef = db.ref('reviews/' + currentGameId).push();
            newRef.set({
                userId: currentUser.uid,
                userName: currentUser.nickname,
                score: pendingScore,
                text: text,
                timestamp: Date.now()
            }).then(() => {
                closeModal('review-modal');
                document.getElementById('review-text').value = '';
            }).catch(error => alert("Ошибка: " + error.message));
        };

        // Profile Page
        function renderProfile() {
            if (!currentUser) return navigate('/');
            
            const avatar = currentUser.avatar || 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMjAiIGhlaWdodD0iMTIwIj48Y2lyY2xlIGN4PSI2MCIgY3k9IjYwIiByPSI1MCIgZmlsbD0iIzMzMyIvPjwvc3ZnPg==';
            
            let html = `
                <div class="profile-header">
                    <button class="back-nav-btn" onclick="navigate('/')">← Назад</button>
                    <img src="${avatar}" class="profile-avatar-large">
                    <div class="profile-info">
                        <h1>${currentUser.nickname}</h1>
                        <div class="profile-status">Не в сети</div>
                        <div class="profile-stats-row">
                            <div class="stat-box"><span class="stat-val">${currentUser.subs}</span><span class="stat-lbl">Подписчиков</span></div>
                            <div class="stat-box"><span class="stat-val">${currentUser.subing}</span><span class="stat-lbl">Подписок</span></div>
                            <div class="stat-box"><span class="stat-val">${currentUser.friends}</span><span class="stat-lbl">Друзей</span></div>
                        </div>
                        <div class="profile-actions">
                            <button class="btn-action btn-primary" onclick="alert('Функция в разработке')">Подписаться</button>
                            <button class="btn-action btn-secondary" onclick="alert('Редактирование в разработке')">Редактировать</button>
                            <button class="btn-action btn-danger" onclick="logout()">Выйти</button>
                        </div>
                    </div>
                </div>
                <div style="display:grid;grid-template-columns:2fr 1fr;gap:20px">
                    <div>
                        <div class="detail-section"><h3>Библиотека игр</h3><p style="color:var(--text-secondary)">Нет игр</p></div>
                        <div class="detail-section"><h3>Созданные игры</h3><p style="color:var(--text-secondary)">0</p></div>
                    </div>
                    <div>
                        <div class="detail-section"><h3>Друзья онлайн</h3><p style="color:var(--text-secondary)">Нет друзей</p></div>
                    </div>
                </div>
            `;
            document.getElementById('app').innerHTML = html;
        }

        function renderConsole() {
            document.getElementById('app').innerHTML = `
                <div style="text-align:center;padding:50px">
                    <h1>ZORO CONSOLE</h1>
                    <p style="color:var(--text-secondary);margin:20px 0">Панель разработчика</p>
                    <a href="https://t.me/zgs_tevs_bot" class="download-btn" target="_blank">Открыть бота</a>
                </div>
            `;
        }

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        window.addEventListener('beforeunload', () => {
            if (reviewsRef) reviewsRef.off();
        });

        handleRouting();
    </script>
</body>
</html>
