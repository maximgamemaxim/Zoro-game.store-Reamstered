<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORO STORE</title>
    <style>
        :root {
            /* Dark Theme (Default) */
            --bg-color: #0f0f13;
            --card-bg: #1a1a20;
            --header-bg: #131318;
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-red: #d93025; 
            --accent-red-hover: #b71c1c;
            --accent-green: #4caf50;
            --accent-yellow: #fdd835;
            --input-bg: #25252e;
            --border-radius: 12px;
            --border-color: #25252e;
        }

        /* Light Theme */
        [data-theme="light"] {
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --header-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-secondary: #6e6e73;
            --accent-red: #d93025; 
            --accent-red-hover: #c52b1f;
            --accent-green: #34a853;
            --accent-yellow: #f9ab00;
            --input-bg: #f0f0f5;
            --border-color: #e0e0e5;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; transition: background-color 0.3s, color 0.3s; }
        
        /* Header */
        header { background-color: var(--header-bg); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--border-color); backdrop-filter: blur(10px); }
        .logo-container { display: flex; align-items: center; text-decoration: none; color: white; cursor: pointer; }
        .logo-img { height: 45px; width: auto; }
        
        nav ul { display: flex; list-style: none; gap: 20px; }
        nav a { text-decoration: none; color: var(--text-secondary); font-size: 14px; font-weight: 500; transition: color 0.2s; cursor: pointer; position: relative; }
        nav a:hover, nav a.active { color: var(--text-main); }
        nav a.active::after { content: ''; position: absolute; bottom: -5px; left: 0; width: 100%; height: 2px; background: var(--accent-red); border-radius: 2px; }
        
        .profile-btn { background-color: var(--input-bg); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; text-decoration: none; color: var(--text-main); transition: background 0.2s; }
        .profile-btn:hover { opacity: 0.8; }

        main { flex: 1; padding: 20px; max-width: 1600px; margin: 0 auto; width: 100%; }
        
        /* --- SEARCH & CATEGORIES (Mobile First) --- */
        .search-bar-container { display: flex; flex-direction: column; gap: 12px; margin-bottom: 25px; animation: fadeIn 0.4s ease; }
        
        .search-row { display: flex; gap: 10px; align-items: center; }
        .search-input { flex: 1; background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 20px; color: var(--text-main); font-size: 14px; outline: none; transition: border 0.2s; }
        .search-input:focus { border-color: var(--accent-red); }
        
        .category-select { background-color: var(--input-bg); border: 1px solid var(--border-color); padding: 12px 16px; border-radius: 20px; color: var(--text-main); font-size: 14px; outline: none; cursor: pointer; min-width: 140px; }
        .category-select:focus { border-color: var(--accent-red); }
        
        .categories-scroll { 
            display: flex; 
            gap: 8px; 
            overflow-x: auto; 
            padding: 5px 0 10px 0; 
            scroll-behavior: smooth;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
        }
        .categories-scroll::-webkit-scrollbar { display: none; }
        
        .filter-tag { 
            background-color: var(--input-bg); 
            padding: 8px 18px; 
            border-radius: 20px; 
            font-size: 13px; 
            cursor: pointer; 
            transition: all 0.2s; 
            color: var(--text-secondary); 
            white-space: nowrap;
            border: 1px solid var(--border-color);
            user-select: none;
        }
        .filter-tag:hover { background-color: var(--border-color); }
        .filter-tag.active { background-color: var(--accent-red); color: white; border-color: var(--accent-red); }

        /* --- GRID SYSTEM --- */
        .section-title { font-size: 20px; margin: 25px 0 15px; font-weight: 700; color: var(--text-main); }
        .games-grid { 
            display: grid; 
            gap: 20px; 
            grid-template-columns: repeat(1, 1fr);
        }

        @media (min-width: 768px) {
            .games-grid { grid-template-columns: repeat(3, 1fr); }
            .search-row { flex-wrap: nowrap; }
        }

        @media (min-width: 1201px) {
            .games-grid { grid-template-columns: repeat(5, 1fr); }
        }

        .game-card { background-color: var(--card-bg); border-radius: var(--border-radius); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; text-decoration: none; color: inherit; display: flex; flex-direction: column; animation: fadeIn 0.5s ease; border: 1px solid var(--border-color); }
        .game-card:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        .card-image { width: 100%; aspect-ratio: 16/9; background-color: var(--input-bg); object-fit: cover; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card-image img { width: 100%; height: 100%; object-fit: cover; }
        .card-content { padding: 12px; display: flex; flex-direction: column; flex: 1; }
        .card-title { font-size: 14px; font-weight: 700; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-category { font-size: 11px; color: var(--accent-yellow); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        .card-desc { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--text-secondary); border-top: 1px solid var(--border-color); padding-top: 10px; margin-top: auto; }
        .iki-badge { background-color: rgba(217, 48, 37, 0.15); color: var(--accent-red); padding: 3px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }

        /* --- GAME DETAIL --- */
        .detail-header { display: flex; gap: 25px; margin-bottom: 25px; flex-wrap: wrap; animation: fadeIn 0.4s ease; }
        .detail-image { width: 280px; height: 380px; background-color: var(--input-bg); border-radius: var(--border-radius); overflow: hidden; flex-shrink: 0; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .detail-image img { width: 100%; height: 100%; object-fit: cover; }
        .detail-info { flex: 1; display: flex; flex-direction: column; gap: 12px; min-width: 250px; }
        .detail-title { font-size: 28px; font-weight: 800; line-height: 1.2; }
        .detail-meta { display: flex; gap: 10px; font-size: 13px; color: var(--text-secondary); flex-wrap: wrap; }
        .tag-pill { background-color: var(--input-bg); padding: 4px 12px; border-radius: 15px; font-size: 12px; border: 1px solid var(--border-color); }
        .download-btn { background-color: var(--accent-red); color: white; border: none; padding: 14px 28px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-block; text-align: center; margin-top: 10px; transition: opacity 0.2s; }
        .download-btn:hover { opacity: 0.9; background-color: var(--accent-red-hover); }
        
        .detail-section { background-color: var(--card-bg); padding: 20px; border-radius: var(--border-radius); margin-bottom: 20px; animation: fadeIn 0.5s ease; border: 1px solid var(--border-color); }
        .detail-section h3 { margin-bottom: 15px; font-size: 17px; color: var(--text-main); border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .detail-section p { color: var(--text-secondary); line-height: 1.6; font-size: 14px; white-space: pre-wrap; }

        /* Reviews System - Simplified */
        .rating-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .rate-btn { flex: 1; min-width: 100px; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-weight: 600; cursor: pointer; color: var(--text-main); transition: transform 0.2s; background: var(--input-bg); font-size: 13px; }
        .rate-btn:hover { transform: translateY(-2px); opacity: 0.9; }
        .rate-pos { border-color: var(--accent-green); }
        .rate-pos:hover { background: var(--accent-green); color: white; }
        .rate-neu { border-color: var(--accent-yellow); }
        .rate-neu:hover { background: var(--accent-yellow); color: #333; }
        .rate-neg { border-color: var(--accent-red); }
        .rate-neg:hover { background: var(--accent-red); color: white; }
        
        .review-list { margin-top: 15px; }
        .review-item { background: var(--input-bg); padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid var(--accent-red); animation: fadeIn 0.3s; }
        .review-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
        .review-author { font-weight: 600; color: var(--text-main); }
        .review-score { font-weight: 700; font-size: 11px; padding: 2px 6px; border-radius: 4px; }
        .score-pos { background: rgba(76, 175, 80, 0.2); color: var(--accent-green); }
        .score-neu { background: rgba(253, 216, 53, 0.2); color: var(--accent-yellow); }
        .score-neg { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }
        .review-text { font-size: 13px; color: var(--text-secondary); line-height: 1.5; }

        /* --- PROFILE --- */
        .profile-header { display: flex; gap: 25px; margin-bottom: 25px; background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); align-items: center; flex-wrap: wrap; position: relative; border: 1px solid var(--border-color); }
        .back-nav-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; color: var(--text-secondary); cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 5px; }
        .back-nav-btn:hover { color: var(--text-main); }
        .profile-avatar-large { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent-red); }
        .profile-info { flex: 1; min-width: 200px; }
        .profile-info h1 { font-size: 24px; margin-bottom: 5px; }
        .profile-status { color: var(--text-secondary); font-size: 12px; margin-bottom: 15px; display: inline-block; }
        .profile-stats-row { display: flex; gap: 12px; margin-bottom: 15px; flex-wrap: wrap; }
        .stat-box { text-align: center; background: var(--input-bg); padding: 8px 14px; border-radius: 8px; min-width: 65px; }
        .stat-val { font-size: 15px; font-weight: 700; color: var(--text-main); display: block; }
        .stat-lbl { font-size: 11px; color: var(--text-secondary); }
        
        .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
        .btn-action { padding: 8px 14px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 12px; transition: 0.2s; color: white; text-decoration: none; }
        .btn-primary { background: var(--accent-red); }
        .btn-primary:hover { background: var(--accent-red-hover); }
        .btn-secondary { background: var(--input-bg); color: var(--text-main); }
        .btn-secondary:hover { opacity: 0.8; }
        .btn-danger { background: rgba(217, 48, 37, 0.2); color: var(--accent-red); }
        .btn-danger:hover { background: rgba(217, 48, 37, 0.3); }

        .profile-content-grid { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 900px) {
            .profile-content-grid { grid-template-columns: 2fr 1fr; }
        }
        .content-block { background: var(--card-bg); padding: 18px; border-radius: var(--border-radius); margin-bottom: 15px; border: 1px solid var(--border-color); }
        .friend-item { display: flex; align-items: center; gap: 10px; padding: 10px; border-bottom: 1px solid var(--border-color); }
        .friend-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--input-bg); object-fit: cover; }
        .online-dot { width: 7px; height: 7px; background: var(--accent-green); border-radius: 50%; margin-left: auto; }

        /* --- LOGIN --- */
        .login-container { max-width: 380px; margin: 40px auto; background: var(--card-bg); padding: 35px; border-radius: var(--border-radius); text-align: center; border: 1px solid var(--border-color); }
        .login-title { font-size: 22px; margin-bottom: 20px; color: var(--accent-red); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 12px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-main); font-size: 14px; }
        .login-btn { width: 100%; padding: 12px; background: var(--accent-red); border: none; border-radius: 8px; color: white; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 14px; }
        .login-divider { margin: 18px 0; color: var(--text-secondary); font-size: 13px; }
        .login-link { color: var(--accent-red); text-decoration: none; font-weight: 600; }

        /* Modal */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .modal-content { background: var(--card-bg); padding: 25px; border-radius: var(--border-radius); width: 90%; max-width: 450px; max-height: 80vh; overflow-y: auto; position: relative; border: 1px solid var(--border-color); }
        .close-modal { position: absolute; top: 12px; right: 12px; background: none; border: none; color: var(--text-secondary); font-size: 22px; cursor: pointer; }
        .close-modal:hover { color: var(--text-main); }

        .loading-screen { display: flex; justify-content: center; align-items: center; height: 60vh; font-size: 16px; color: var(--text-secondary); flex-direction: column; gap: 10px; }
        .error-msg { color: var(--accent-red); font-size: 13px; max-width: 500px; text-align: center; background: rgba(217, 48, 37, 0.1); padding: 15px; border-radius: 8px; display: none; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 600px) {
            header { padding: 10px 15px; }
            nav ul { gap: 12px; font-size: 12px; }
            .logo-img { height: 38px; }
            .detail-header { flex-direction: column; }
            .detail-image { width: 100%; height: 220px; }
            .profile-header { padding: 20px; }
            .profile-avatar-large { width: 100px; height: 100px; }
            .search-row { flex-direction: column; }
            .category-select { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo-container" onclick="navigate('/')">
            <img src="logo.png" alt="Zoro Logo" class="logo-img" id="header-logo">
        </a>
        <nav>
            <ul>
                <li><a href="/" onclick="navigate('/')">Главная</a></li>
                <li><a href="/games" onclick="navigate('/games')">Игры</a></li>
                <li><a href="/console" onclick="navigate('/console')">Консоль</a></li>
                <li><a href="https://t.me/Zoro_service" target="_blank">Сообщество</a></li>
            </ul>
        </nav>
        <a href="/profile" onclick="navigate('/profile')" class="profile-btn" id="header-profile-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </a>
    </header>

    <main id="app">
        <div id="loading" class="loading-screen">
            <div>Загрузка...</div>
            <div id="error-box" class="error-msg"></div>
        </div>
    </main>

    <div id="modal-overlay" class="modal-overlay" onclick="if(event.target === this) closeModal()">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <h2 id="modal-title" style="margin-bottom: 15px; font-size: 18px;">Заголовок</h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const BASE_URL = "https://zoro-game.store";
        const DB_URL = "https://zoro-game.store/data/ZObase.json";
        
        let gamesData = [];
        let allCategories = new Set();
        const app = document.getElementById('app');
        let currentUser = JSON.parse(localStorage.getItem('zgs_user')) || null;

        // --- AUTO THEME DETECTION ---
        function initTheme() {
            const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (isDark) {
                document.documentElement.removeAttribute('data-theme');
                document.getElementById('header-logo').src = 'logo-dark.png';
            } else {
                document.documentElement.setAttribute('data-theme', 'light');
                document.getElementById('header-logo').src = 'logo.png';
            }
            
            // Listen for theme changes
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (e.matches) {
                    document.documentElement.removeAttribute('data-theme');
                    document.getElementById('header-logo').src = 'logo-dark.png';
                } else {
                    document.documentElement.setAttribute('data-theme', 'light');
                    document.getElementById('header-logo').src = 'logo.png';
                }
            });
        }

        // --- ROUTING ---
        function handleRouting() {
            let path = window.location.pathname;
            if (path !== '/' && path.endsWith('/')) path = path.slice(0, -1);
            
            const searchParams = new URLSearchParams(window.location.search);
            const gameId = searchParams.get('id') || searchParams.get('game');

            document.querySelectorAll('nav a').forEach(a => {
                a.classList.remove('active');
                const href = a.getAttribute('href');
                if ((path === '/' && href === '/') || (path.includes(href) && href !== '/' && !href.startsWith('http'))) {
                    a.classList.add('active');
                }
            });

            const profBtn = document.getElementById('header-profile-btn');
            if(currentUser) {
                profBtn.innerHTML = `<img src="${currentUser.avatar || 'default.png'}" style="width:20px;height:20px;border-radius:50%">`;
            } else {
                profBtn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>`;
            }

            if (path === '/' || path === '/games' || path === '' || path.endsWith('index.html')) {
                renderHome();
            } else if (path === '/game' && gameId) {
                renderGameDetail(gameId);
            } else if (path === '/console') {
                renderConsole();
            } else if (path === '/profile') {
                renderProfile();
            } else if (path === '/login') {
                renderLogin();
            } else {
                renderPlaceholder('404', 'Страница не найдена.', 'На главную', '/');
            }
        }

        function navigate(path) {
            history.pushState({}, '', path);
            handleRouting();
            window.scrollTo(0, 0);
        }

        window.onpopstate = handleRouting;

        // --- RENDERERS ---
        function renderHome() {
            if (gamesData.length === 0) return;
            
            const catsArray = Array.from(allCategories);
            let options = `<option value="all">Все категории</option>`;
            catsArray.forEach(c => {
                options += `<option value="${c}">${c}</option>`;
            });

            let html = `
                <div style="animation: fadeIn 0.4s ease;">
                    <div class="search-bar-container">
                        <div class="search-row">
                            <input type="text" class="search-input" placeholder="Поиск игр..." id="search-input">
                            <select class="category-select" id="category-select">${options}</select>
                        </div>
                    </div>
                    <h2 class="section-title">${window.location.pathname.includes('games') ? 'Каталог' : 'Популярное'}</h2>
                    <div class="games-grid" id="games-grid-container"></div>
                </div>
            `;
            app.innerHTML = html;
            
            renderCatalog(gamesData);
            
            document.getElementById('search-input').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const cat = document.getElementById('category-select').value;
                let filtered = gamesData.filter(g => (g.title && g.title.toLowerCase().includes(term)) || (g.DEVELOPER && g.DEVELOPER.toLowerCase().includes(term)));
                if (cat !== 'all') {
                    filtered = filtered.filter(g => g["#"] && g["#"].includes(cat));
                }
                renderCatalog(filtered);
            });
            
            document.getElementById('category-select').addEventListener('change', (e) => {
                const cat = e.target.value;
                const term = document.getElementById('search-input').value.toLowerCase();
                let filtered = gamesData;
                if (cat !== 'all') {
                    filtered = filtered.filter(g => g["#"] && g["#"].includes(cat));
                }
                if (term) {
                    filtered = filtered.filter(g => (g.title && g.title.toLowerCase().includes(term)) || (g.DEVELOPER && g.DEVELOPER.toLowerCase().includes(term)));
                }
                renderCatalog(filtered);
            });
        }

        function renderCatalog(list) {
            const grid = document.getElementById('games-grid-container');
            if (!grid) return;
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--text-secondary)">Ничего не найдено</div>';
                return;
            }
            list.forEach(game => {
                const card = document.createElement('a');
                card.className = 'game-card';
                card.href = `/game?id=${game.id}`;
                card.onclick = (e) => { e.preventDefault(); navigate(`/game?id=${game.id}`); };
                
                let imgUrl = game.IconGame || '';
                if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
                const fallback = 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyMDAiIGhlaWdodD0iMTUwIiB2aWV3Qm94PSIwIDAgMjAwIDE1MCI+PHJlY3Qgd2lkdGg9IjIwMCIgaGVpZ2h0PSIxNTAiIGZpbGw9IiMyYTIhMzUiLz48dGV4dCB4PSI1MCUiIHk9IjUwJSIgZG9taW5hbnQtYmFzZWxpbmU9Im1pZGRsZSIgdGV4dC1hbmNob3I9Im1pZGRsZSIgZmlsbD0iIzU1NSIgZm9udC1zaXplPSIyMCI+Tm8gSW1hZ2U8L3RleHQ+PC9zdmc+';
                
                const catText = game["#"] ? game["#"].split(',')[0] : 'GAME';
                const iki = game["ИКИ"] ?? 0;

                card.innerHTML = `
                    <div class="card-image"><img src="${imgUrl || fallback}" onerror="this.src='${fallback}'"></div>
                    <div class="card-content">
                        <div class="card-title">${game.title}</div>
                        <div class="card-category">${catText}</div>
                        <div class="card-desc">${game.descr || ''}</div>
                        <div class="card-footer">
                            <span>${game.DEVELOPER || 'Unknown'}</span>
                            <span class="iki-badge">ИКИ ${iki}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function renderGameDetail(id) {
            const game = gamesData.find(g => g.id == id);
            if (!game) { app.innerHTML = `<div class="page-placeholder"><h1>Не найдено</h1><a href="/" class="btn-action btn-primary" onclick="navigate('/')">Назад</a></div>`; return; }

            let imgUrl = game.IconGame || '';
            if (imgUrl.startsWith('/')) imgUrl = BASE_URL + imgUrl;
            let dlUrl = game.download_link || '#';
            if (dlUrl.startsWith('/')) dlUrl = BASE_URL + dlUrl;
            
            const type = game["#"] ? game["#"].split(',')[0] : 'EXE';
            const year = game["year of release"] || '2025';
            const ver = game.UPDATES_Vers || '1.0';
            
            const reviewsKey = `reviews_${game.id}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];

            let reviewsHtml = '';
            if(reviews.length === 0) {
                reviewsHtml = '<div style="color:var(--text-secondary);text-align:center;padding:20px">Отзывов пока нет</div>';
            } else {
                reviews.forEach(r => {
                    let scoreClass = r.score > 0 ? 'score-pos' : (r.score < 0 ? 'score-neg' : 'score-neu');
                    let scoreText = r.score > 0 ? 'Положительный' : (r.score < 0 ? 'Отрицательный' : 'Нейтральный');
                    reviewsHtml += `
                        <div class="review-item">
                            <div class="review-header">
                                <span class="review-author">${r.author}</span>
                                <span class="review-score ${scoreClass}">${scoreText}</span>
                            </div>
                            <div class="review-text">${r.text}</div>
                        </div>
                    `;
                });
            }

            // Reviews moved to BOTTOM
            app.innerHTML = `
                <button class="back-nav-btn" onclick="navigate('/games')">← Назад</button>
                <div class="detail-header">
                    <div class="detail-image"><img src="${imgUrl}" onerror="this.src='${imgUrl}'"></div>
                    <div class="detail-info">
                        <h1 class="detail-title">${game.title}</h1>
                        <div class="detail-meta">
                            <span class="tag-pill">${type}</span>
                            <span class="tag-pill">${year}</span>
                            <span class="tag-pill">${game.DEVELOPER || 'Unknown'}</span>
                        </div>
                        
                        <a href="${dlUrl}" class="download-btn" target="_blank">Скачать</a>
                        
                        <div style="display: flex; gap: 15px; margin-top: 10px;">
                            <div><span style="color:var(--text-secondary)">ИКИ:</span> <strong style="color:var(--accent-red)">${game["ИКИ"] || 0}</strong></div>
                            <div><span style="color:var(--text-secondary)">Версия:</span> <strong>${ver}</strong></div>
                        </div>

                        <div class="detail-section">
                            <h3>Описание</h3>
                            <p>${game.descr || 'Нет описания.'}</p>
                        </div>
                         <div class="detail-section">
                            <h3>Обновление (v${ver})</h3>
                            <p>${game.UPDATES_descr || 'Нет данных.'}</p>
                        </div>
                        
                        <!-- Reviews at BOTTOM -->
                        <div class="detail-section">
                            <h3>Оценить игру</h3>
                            <div class="rating-controls">
                                <button class="rate-btn rate-pos" onclick="submitReview(${game.id}, 10)">Положительная</button>
                                <button class="rate-btn rate-neu" onclick="submitReview(${game.id}, 5)">Нейтральная</button>
                                <button class="rate-btn rate-neg" onclick="submitReview(${game.id}, -10)">Отрицательная</button>
                            </div>
                            
                            <h3 style="margin-top:20px;">Отзывы</h3>
                            <div class="review-list" id="reviews-list-${game.id}">
                                ${reviewsHtml}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function submitReview(gameId, score) {
            if (!currentUser) {
                alert("Для отзыва нужно войти в аккаунт!");
                navigate('/login');
                return;
            }

            const text = prompt("Ваш отзыв:", "");
            if (text === null) return;

            const review = {
                author: currentUser.username,
                score: score,
                text: text || "Без комментария",
                date: new Date().toLocaleDateString()
            };

            const reviewsKey = `reviews_${gameId}`;
            let reviews = JSON.parse(localStorage.getItem(reviewsKey)) || [];
            reviews.unshift(review);
            localStorage.setItem(reviewsKey, JSON.stringify(reviews));

            renderGameDetail(gameId);
        }

            app.innerHTML = `
                <div class="profile-header">
                    <button class="back-nav-btn" onclick="navigate('/')">← На главную</button>

                        </div>
                        <div class="profile-actions">
                            <button class="btn-action btn-primary" onclick="alert('Функция в разработке')">Подписаться</button>
                            <button class="btn-action btn-secondary" onclick="openModal('Редактировать профиль', '<input type=\'text\' class=\'login-input\' placeholder=\'Новый ник\' id=\'edit-nick\'><button class=\'login-btn\' onclick=\'updateNick()\">Сохранить</button>')">Редактировать</button>

                            <button class="btn-action btn-danger" onclick="logout()">Выйти</button>
                        </div>
                    </div>
                </div>

                <div class="profile-content-grid">
                    <div>
                        <div class="content-block">
                            <h3>Библиотека игр</h3>
                            <p style="color:var(--text-secondary);padding:20px;text-align:center">Нет игр</p>
                        </div>
                        <div class="content-block">
                            <h3>Игры созданные при участии</h3>
                            <p style="color:var(--text-secondary);padding:20px;text-align:center">0</p>
                        </div>
                    </div>
                    <div>
                        <div class="content-block">

                            <div class="friend-item">

                                <span class="online-dot"></span>
                            </div>
                        </div>
                        <div class="content-block">
                            <h3>Действия</h3>
                            <button class="btn-action btn-secondary" style="width:100%;margin-bottom:10px" onclick="openModal('Чёрный список', '<p style=\'color:var(--text-secondary)\'>Список пуст</p>')">Чёрный список</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderLogin() {
            if (currentUser) {
                navigate('/profile');
                return;
            }
            app.innerHTML = `
                <div class="login-container">
                    <h2 class="login-title">Вход на ZGS</h2>
                    <input type="text" class="login-input" id="login-user" placeholder="Логин">
                    <input type="password" class="login-input" placeholder="Пароль">
                    <button class="login-btn" onclick="performLogin()">Войти</button>
                    
                    <div class="login-divider">или</div>
                    
                    <button class="btn-action btn-secondary" style="width:100%;justify-content:center" onclick="alert('Регистрация через Telegram в разработке')">Через Telegram</button>
                    
                    <p style="margin-top:20px;font-size:12px;color:var(--text-secondary)">
                        Нет аккаунта? <a href="#" class="login-link" onclick="alert('Регистрация в разработке')">Зарегаться</a>
                    </p>
                </div>
            `;
        }

        function performLogin() {
            const username = document.getElementById('login-user').value;
            if (!username) return alert("Введите имя");
            
            currentUser = { username: username, avatar: '', subs: 3, subing: 1, friends: 1 };
            localStorage.setItem('zgs_user', JSON.stringify(currentUser));
            navigate('/profile');
        }

        function logout() {
            localStorage.removeItem('zgs_user');
            currentUser = null;
            navigate('/');
            location.reload();
        }
        
        function updateNick() {
            const newNick = document.getElementById('edit-nick').value;
            if(newNick && currentUser) {
                currentUser.username = newNick;
                localStorage.setItem('zgs_user', JSON.stringify(currentUser));
                closeModal();
                renderProfile();
            }
        }

        function shareProfile() {
            navigator.clipboard.writeText(window.location.href).then(() => alert("Ссылка скопирована!"));
        }

        function renderConsole() {
             app.innerHTML = `
                <div class="console-hero" style="background:var(--card-bg);border:1px solid var(--border-color);border-radius:var(--border-radius);padding:30px;text-align:center;margin-bottom:25px">
                    <h1 style="font-size:24px;margin-bottom:10px">ZORO CONSOLE</h1>
                    <p style="color:var(--text-secondary);margin-top:10px;font-size:14px">Панель разработчика</p>
                    <div style="display:flex;justify-content:center;gap:30px;margin-top:20px;flex-wrap:wrap">
                        <div><span style="font-size:22px;font-weight:700;color:var(--accent-red);display:block">250+</span><span style="font-size:11px;color:var(--text-secondary)">Пользователей</span></div>
                        <div><span style="font-size:22px;font-weight:700;color:var(--accent-red);display:block">120+</span><span style="font-size:11px;color:var(--text-secondary)">Игр</span></div>

                    <a href="https://t.me/zgs_tevs_bot" class="btn-action btn-primary" target="_blank">Открыть бота</a>
                </div>
            `;

        function renderPlaceholder(title, desc, btnText, btnLink) {
            const btn = btnText ? `<a href="${btnLink}" class="btn-action btn-primary" onclick="event.preventDefault(); navigate('${btnLink}')">${btnText}</a>` : '';
            app.innerHTML = `<div class="page-placeholder" style="text-align:center;padding:60px 20px"><h1>${title}</h1><p style="color:var(--text-secondary);margin:20px 0;font-size:14px">${desc}</p>${btn}</div>`;
        }

        function openModal(title, content) {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-body').innerHTML = content;
            document.getElementById('modal-overlay').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-overlay').style.display = 'none';
        }

        async function loadDatabase() {
            try {
                const response = await fetch(DB_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                gamesData = Array.isArray(data) ? data : (data.games || []);
                
                if (gamesData.length === 0) throw new Error("База пуста");

                gamesData.forEach(game => {
                    if (game["#"]) {
                        game["#"].split(',').forEach(c => {
                            if(c.trim()) allCategories.add(c.trim());
                        });
                    }
                });

                document.getElementById('loading').style.display = 'none';
                handleRouting();

            } catch (error) {
                console.error(error);
                const errBox = document.getElementById('error-box');
                errBox.style.display = 'block';
                errBox.innerHTML = `<strong>Ошибка ZObase.json</strong><br>${error.message}`;
            }
        }

        // Init
        initTheme();
        loadDatabase();
    </script>
